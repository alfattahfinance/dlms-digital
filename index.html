<script>
let sendTimers = {};
let currentFocusedChannel = "ina";
let currentProcessorTab = "preamp";

const channelIds = ["ina", "inb", "out1", "out2", "out3", "out4"];
const channelNames = { "ina": "In A", "inb": "In B", "out1": "Out 1 (Sub)", "out2": "Out 2 (Low)", "out3": "Out 3 (Mid)", "out4": "Out 4 (High)" };

const geqFrequencies = [
  "20", "25", "31.5", "40", "50", "63", "80", "100", "125", "160",
  "200", "250", "315", "400", "500", "630", "800", "1k", "1k25", "1k6",
  "2k", "2k5", "3k15", "4k", "5k", "6k3", "8k", "10k", "12k5", "16k", "20k"
];

let muteStates = {};
let onStates = {};
let channelCompressors = {};
let channelProcessors = {};
let channelGeqValues = {};

let audioCtx = null;
let audioSourceNode = null;
let isAudioInitialized = false;

let analysers = {};
let rtaAnalyser = null;
let rtaFrequencyData = null;
let rtaCanvases = {};
let filters = {};
let outputMeterGains = {};

channelIds.forEach(id => {
  muteStates[id] = false;
  onStates[id] = false;
  channelCompressors[id] = { atk: 60, rel: 141, ratio: 1.5, thr: -30.5, outY: 105, gain: 0, mix: 100 };
  channelProcessors[id] = {
    pre_gain: 12.0, pre_pad: 0, pre_phase: 0,
    hpf_freq: 80, hpf_slope: 24, lpf_freq: 18000, lpf_slope: 24,
    gate_thr: -45, gate_rng: -40, gate_atk: 5.0, gate_rel: 200,
    peq_band: 2, peq_freq: 1000, peq_gain: 0.0, peq_q: 1.4,
    peq_bands: [{freq:80,gain:0,q:1.4},{freq:250,gain:0,q:1.4},{freq:1000,gain:0,q:1.4},{freq:4000,gain:0,q:1.4},{freq:12000,gain:0,q:1.4}]
  };
  channelGeqValues[id] = new Array(geqFrequencies.length).fill(0);
});

const dlmsState = {
  activeChannel: "ina",
  channels: Object.fromEntries(channelIds.map(id => [id, {
    id, gain: 0, processor: channelProcessors[id],
    compressor: channelCompressors[id], geq: channelGeqValues[id]
  }]))
};

function getChannelState(id = dlmsState.activeChannel) {
  return channelIds.includes(id) ? dlmsState.channels[id] : null;
}

let appRenderFrame = 0;
let pendingGraphRender = null;

function scheduleAppRender(graphTask = null) {
  if (graphTask) pendingGraphRender = graphTask;
  if (appRenderFrame) return;
  appRenderFrame = requestAnimationFrame(renderApp);
}

function renderApp() {
  appRenderFrame = 0;
  const graphTask = pendingGraphRender;
  pendingGraphRender = null;

  if (graphTask && graphTask.channelId === dlmsState.activeChannel) {
    handleGraphMove(graphTask.event, graphTask.tab, graphTask.dragNode, graphTask.box, graphTask.svg, graphTask.channelId);
  }

  updateActiveProcessorUI();

  const gateSvg = document.querySelector("#gate-graph-box > svg");
  if (gateSvg) gateSvg.style.display = currentProcessorTab === "gate" ? "block" : "none";
  const compSvg = document.querySelector("#comp-graph-box > svg");
  if (compSvg) compSvg.style.display = currentProcessorTab === "comp" ? "block" : "none";
}

function redrawActiveVisuals() {
  scheduleAppRender();
}

function setChannelGain(id, value) {
  const state = getChannelState(id), num = Number(value);
  if (!state || !Number.isFinite(num)) return;
  state.gain = num;
  const fader = document.getElementById("gain-" + id);
  if (fader && Number(fader.value) !== num) fader.value = String(num);
  updateFaderLabel(id, num);
  if (id === dlmsState.activeChannel) redrawActiveVisuals();
}

function isInputChannel(id) {
  return id.startsWith("in");
}

function buildMixerStrips() {
  const container = document.getElementById("mixer-bank-container");
  if (!container) return;
  let html = '';
  channelIds.forEach(id => {
    let isOut = !isInputChannel(id);
    let name = channelNames[id];
    let sub = isOut ? (id === 'out1' ? 'Sub' : (id === 'out2' ? 'Low' : (id === 'out3' ? 'Mid' : 'High'))) : (id === 'ina' ? 'Master 1' : 'Master 2');
    
    html += `
      <div class="channel-strip ${id === currentFocusedChannel ? 'focused' : ''}" id="strip-${id}" onclick="focusChannel('${id}')">
        <div class="ch-header-sq ${isOut ? 'out-header' : ''}">
          <div class="ch-name">${name}</div>
          <div class="ch-sublabel" ${isOut ? 'style="color:#fef08a;"' : ''}>${sub}</div>
        </div>
        <div class="eq-curve-box">
          <svg viewBox="0 0 100 40" preserveAspectRatio="xMidYMid meet">
            <line x1="0" y1="20" x2="100" y2="20" class="mini-grid"/>
            <path id="mini-curve-${id}" class="mini-path" d="M 0 35 L 60 20 L 100 20"/>
          </svg>
        </div>
        <button class="sq-btn" id="mute-${id}" onclick="toggleMute('${id}', event)">Mute</button>
        <button class="sq-btn on-btn" id="on-${id}" onclick="toggleOn('${id}', event)">On</button>
        <div class="db-value" id="val-${id}">0.0 dB</div>
        <div class="fader-meter-area">
          <div class="fader-scale">
            ${isOut ? '<span>12</span><span>0</span><span>-12</span><span>-40</span>' : '<span>20</span><span>0</span><span>-20</span><span>-40</span>'}
          </div>
          <div class="vertical-slider-container">
            <div class="sq-led-meter">
              <div class="sq-meter-fill" id="meter-${id}" style="height: 0%;"></div>
            </div>
            <input type="range" class="vertical-fader" id="gain-${id}" min="-40" max="${isOut ? '12' : '20'}" step="0.5" value="0">
          </div>
          <div class="fader-right-indicator">
            <span>C</span><span class="tick-right"></span><span class="tick-right"></span><span class="tick-right"></span>
          </div>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;

  channelIds.forEach(id => {
    const fader = document.getElementById("gain-" + id);
    if (fader) {
      fader.addEventListener("input", () => {
        setChannelGain(id, fader.value);
        updateParam(id, fader.value);
      });
    }
  });
}

function updateSidebarForChannel(id) {
  const sidebar = document.getElementById("processor-sidebar");
  if (!sidebar) return;

  let html = '';
  if (isInputChannel(id)) {
    html += `<div class="tc-side-btn" id="side-preamp" onclick="switchProcessorPage('preamp')">Preamp</div>`;
    html += `<div class="tc-side-btn" id="side-hpf" onclick="switchProcessorPage('hpf')">HPF</div>`;
    html += `<div class="tc-side-btn" id="side-gate" onclick="switchProcessorPage('gate')">Gate</div>`;
    html += `<div class="tc-side-btn" id="side-peq" onclick="switchProcessorPage('peq')">PEQ</div>`;
    html += `<div class="tc-side-btn" id="side-geq" onclick="switchProcessorPage('geq')">31-Band GEQ</div>`;
    html += `<div class="tc-side-btn" id="side-comp" onclick="switchProcessorPage('comp')">Compressor</div>`;
  } else {
    html += `<div class="tc-side-btn" id="side-preamp" onclick="switchProcessorPage('preamp')">Preamp</div>`;
    html += `<div class="tc-side-btn" id="side-hpf" onclick="switchProcessorPage('hpf')">Crossover</div>`;
    html += `<div class="tc-side-btn" id="side-peq" onclick="switchProcessorPage('peq')">PEQ</div>`;

  }
  sidebar.innerHTML = html;

}

function geqFrequencyHz(label) {
  const value = String(label).toLowerCase();
  if (value.endsWith("k")) return parseFloat(value) * 1000;
  if (value.includes("k")) return parseFloat(value.replace("k", ".")) * 1000;
  return parseFloat(value);
}

function buildGeqSliders() {
  const wrapper = document.getElementById("geq-sliders-wrapper");
  if (!wrapper) return;
  const minLog = Math.log10(20);
  const maxLog = Math.log10(20000);
  wrapper.innerHTML = geqFrequencies.map((freq, idx) => {
    const hz = geqFrequencyHz(freq);
    const logPosition = (Math.log10(hz) - minLog) / (maxLog - minLog);
    const xPercent = 2 + (Math.max(0, Math.min(1, logPosition)) * 96);
    return `
      <div class="geq-slider-col" style="left:${xPercent}%;" data-frequency="${hz}">
        <div class="geq-val-label" id="geq-val-${idx}">0.0</div>
        <div class="geq-slider-track">
          <input type="range" class="geq-range" id="geq-slider-${idx}" min="-12" max="12" step="0.5" value="0" aria-label="GEQ ${freq} Hz" oninput="onGeqSliderChange(${idx}, this.value)">
        </div>
        <div class="geq-freq-label-wrapper">
          <div class="geq-freq-label">${freq}</div>
        </div>
      </div>
    `;
  }).join("");
}

function updateGeqUI() {
  let geqVals = channelGeqValues[currentFocusedChannel] || new Array(geqFrequencies.length).fill(0);
  geqVals.forEach((val, idx) => {
    const slider = document.getElementById(`geq-slider-${idx}`);
    const valLbl = document.getElementById(`geq-val-${idx}`);
    if (slider) slider.value = val;
    if (valLbl) {
      let formatted = Number(val).toFixed(1);
      valLbl.textContent = (val > 0 ? "+" : "") + formatted;
    }
  });
}

function onGeqSliderChange(index, val, channelId = dlmsState.activeChannel) {
  const state = getChannelState(channelId);
  if (!state || index < 0 || index >= geqFrequencies.length) return;
  let numVal = parseFloat(val);
  if (!Number.isFinite(numVal)) return;
  state.geq[index] = numVal;

  // Apply this band's gain to the live Web Audio filter for this input.
  const geqNodes = filters[channelId + "_geq"];
  if (geqNodes && geqNodes[index] && audioCtx) {
    geqNodes[index].gain.setTargetAtTime(numVal, audioCtx.currentTime, 0.015);
  }
  
  const valLbl = document.getElementById(`geq-val-${index}`);
  if (valLbl) {
    let formatted = numVal.toFixed(1);
    valLbl.textContent = (numVal > 0 ? "+" : "") + formatted;
  }
  updateParam(`geq_${channelId}_${index}`, numVal);
  if (channelId === dlmsState.activeChannel) redrawActiveVisuals();
}

function resetGEQ() {
  const channelId = dlmsState.activeChannel, state = getChannelState(channelId);
  if (!state) return;
  state.geq = new Array(geqFrequencies.length).fill(0);
  channelGeqValues[channelId] = state.geq;
  const geqNodes = filters[channelId + "_geq"];
  if (geqNodes && audioCtx) {
    geqNodes.forEach(node => node.gain.setTargetAtTime(0, audioCtx.currentTime, 0.015));
  }
  updateGeqUI();
  updateParam(`geq_${channelId}_reset`, '0');
  redrawActiveVisuals();
}

const DSP_NODE_POLICY = Object.freeze({
  preamp: [],
  hpf: ["node-hpf-group", "node-lpf-group"],
  gate: ["node-gate-group"],
  peq: ["node-peq-band-1", "node-peq-band-2", "node-peq-band-3", "node-peq-band-4", "node-peq-band-5"],
  geq: [],
  comp: ["node-thresh-group"]
});

function initializePermanentDSPNodes() {
  const svgFor = id => document.querySelector("#proc-page-" + id + " svg");
  const makeNode = (id, x, y, color, radius) => {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("id", id); g.setAttribute("class", "screen-real-knob");
    g.setAttribute("transform", "translate(" + x + "," + y + ")");
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("r", String(Math.min(radius, 6)));
    c.setAttribute("fill", "transparent");
    c.setAttribute("stroke", color);
    c.setAttribute("stroke-width", "2.2");
    c.setAttribute("vector-effect", "non-scaling-stroke");
    g.style.setProperty("--node-active-fill", color === "#ff2a6d" ? "rgba(255,42,109,0.16)" : "rgba(54,244,255,0.16)");
    g.appendChild(c); return g;
  };
  const hpfSvg = svgFor("hpf");
  if (hpfSvg && !document.getElementById("node-lpf-group")) hpfSvg.appendChild(makeNode("node-lpf-group", 275, 100, "#00e5ff", 8));
  const peqSvg = svgFor("peq");
  if (peqSvg) {
    for (let i = 1; i <= 5; i++) {
      const id = "node-peq-band-" + i;
      if (!document.getElementById(id)) {
        const node = makeNode(id, 30 + i * 45, 100, "#ff2a6d", 7);
        node.dataset.peqBand = String(i); peqSvg.appendChild(node);
      }
    }
  }
}

function enforceDSPNodePolicy(pageName) {
  initializePermanentDSPNodes();
  const allowed = new Set(DSP_NODE_POLICY[pageName] || []);
  Object.keys(DSP_NODE_POLICY).forEach(page => {
    (DSP_NODE_POLICY[page] || []).forEach(id => {
      const node = document.getElementById(id);
      if (node) node.style.display = allowed.has(id) ? "" : "none";
    });
  });
  ["node-preamp-group", "node-output-group", "node-peq-group"].forEach(id => {
    const legacy = document.getElementById(id);
    if (legacy) legacy.style.display = "none";
  });
}

function switchProcessorPage(pageName) {
  if (pageName === "comp" && !isInputChannel(currentFocusedChannel)) pageName = "preamp";
  currentProcessorTab = pageName;
  enforceDSPNodePolicy(pageName);

  const rtaAllowed = ["peq", "hpf", "geq"].includes(pageName);
  Object.values(rtaCanvases).forEach(item => {
    if (!item || !item.canvas) return;
    item.canvas.style.display = rtaAllowed ? "block" : "none";
    if (!rtaAllowed) {
      const ctx = item.canvas.getContext("2d");
      if (ctx) {
        ctx.clearRect(0, 0, item.canvas.width, item.canvas.height);
        ctx.beginPath();
      }
    }
  });

  const gateSvg = document.querySelector("#gate-graph-box > svg");
  if (gateSvg) gateSvg.style.display = pageName === "gate" ? "block" : "none";
  const compSvg = document.querySelector("#comp-graph-box > svg");
  if (compSvg) compSvg.style.display = pageName === "comp" ? "block" : "none";

  ["preamp", "hpf", "gate", "peq", "geq", "comp"].forEach(name => {
    const btn = document.getElementById("side-" + name);
    const page = document.getElementById("proc-page-" + name);
    const knobs = document.getElementById("knobs-group-" + name);
    if (btn) btn.classList.toggle("active", name === pageName);
    if (page) page.style.display = (name === pageName) ? "block" : "none";
    if (knobs) knobs.style.display = (name === pageName) ? "grid" : "none";
  });
  if (pageName === 'geq') updateGeqUI();
  updateActiveProcessorUI();
}

function updateKnobRotation(indicatorId, val, min, max) {
  const ind = document.getElementById(indicatorId);
  if (!ind) return;
  let pct = (val - min) / (max - min || 1);
  let deg = -135 + (pct * 270);
  ind.style.transform = `translateX(-50%) rotate(${deg}deg)`;
}

function drawBackgroundGrid(svg, host, page) {
  if (!svg || !host) return;
  const layer = svg.querySelector(".graph-legacy-coordinate-layer");
  if (!layer) return;
  svg.querySelectorAll("[data-dlms-grid='true']").forEach(node => node.remove());
  layer.querySelectorAll("line.sq-grid-line, line.zero-fixed-line, .sq-grid-text").forEach(node => node.remove());
  const rect = host.getBoundingClientRect();
  const width = Math.max(1, rect.width || 600), height = Math.max(1, rect.height || 350);
  let baseScale = Math.min(width / 600, height / 350);
  baseScale = Math.max(0.35, Math.min(1.25, baseScale));
  const NS = "http://www.w3.org/2000/svg";
  const group = document.createElementNS(NS, "g");
  group.setAttribute("data-dlms-grid", "true");
  group.setAttribute("aria-hidden", "true");
  group.style.pointerEvents = "none";
  const addLine = (x1,y1,x2,y2,stronger=false) => {
    const line = document.createElementNS(NS,"line");
    line.setAttribute("x1",x1); line.setAttribute("y1",y1);
    line.setAttribute("x2",x2); line.setAttribute("y2",y2);
    line.setAttribute("stroke","rgba(255,255,255,0.08)");
    line.setAttribute("stroke-width",stronger ? "0.9" : "0.65");
    line.setAttribute("vector-effect","non-scaling-stroke");
    line.setAttribute("class",stronger ? "zero-fixed-line" : "sq-grid-line");
    group.appendChild(line);
  };
  const addLabel = (value,x,y,anchor="start") => {
    const label = document.createElementNS(NS,"text");
    label.setAttribute("x",x); label.setAttribute("y",y);
    label.setAttribute("text-anchor",anchor);
    label.setAttribute("dominant-baseline","middle");
    label.setAttribute("class","sq-grid-text");
    label.setAttribute("font-size",Math.max(6.5,7.2*baseScale).toFixed(2));
    label.setAttribute("font-family","Arial, sans-serif");
    label.setAttribute("font-weight","400");
    label.setAttribute("fill","rgba(255,255,255,0.45)");
    label.setAttribute("stroke","none");
    label.textContent=value;
    group.appendChild(label);
  };
  const preampGraph = page === "preamp";
  const hpfGraph = page === "hpf";
  const levelGraph = page==="gate" || page==="comp" || page==="limiter";
  const yTicks = preampGraph
    ? [{v:60,label:"+60"},{v:50,label:"+50"},{v:40,label:"+40"},{v:30,label:"+30"},{v:20,label:"+20"},{v:10,label:"+10"},{v:0,label:"0"},{v:-10,label:"-10"}]
    : hpfGraph
      ? [{v:0,label:"0"},{v:-6,label:"-6"},{v:-12,label:"-12"},{v:-18,label:"-18"},{v:-24,label:"-24"},{v:-30,label:"-30"},{v:-36,label:"-36"}]
      : levelGraph
        ? [{v:0,label:"0"},{v:-15,label:"-15"},{v:-30,label:"-30"},{v:-45,label:"-45"},{v:-60,label:"-60"}]
        : [{v:30,label:"+30"},{v:15,label:"+15"},{v:0,label:"0"},{v:-15,label:"-15"},{v:-30,label:"-30"}];
  const yToCoord = value => preampGraph
    ? 10 + ((60 - value) / 70) * 180
    : hpfGraph ? 10 + ((0 - value) / 36) * 180
    : levelGraph ? 10+((0-value)/60)*180 : 10+((30-value)/60)*180;
  yTicks.forEach(tick => {
    const y=yToCoord(tick.v);
    addLine(30,y,300,y,tick.v===0);
    addLabel(tick.label + (preampGraph ? " dB" : ""),24,y,"end");
  });
  if (preampGraph) {
    [30,120,210,300].forEach(x => addLine(x,10,x,190));
    addLabel("INPUT GAIN (dB)",165,205,"middle");
  } else if (levelGraph) {
    const minDb=page==="gate" ? -80 : -60;
    const ticks=page==="gate" ? [-80,-60,-40,-20,0] : [-60,-45,-30,-15,0];
    ticks.forEach(db => {
      const x=30+((db-minDb)/(0-minDb))*270;
      addLine(x,10,x,190);
      addLabel(String(db),x,195,"middle");
    });
    addLabel("INPUT dB",165,194,"middle");
  } else {
    [20,31.5,50,100,200,500,1000,2000,5000,10000,20000].forEach(freq => {
      const x=30+270*Math.log(freq/20)/Math.log(1000);
      addLine(x,10,x,190);
      if ([20,100,1000,10000,20000].includes(freq)) {
        const label=freq>=1000 ? (freq===20000 ? "20k" : (freq/1000)+"k") : String(freq);
        addLabel(label,x,195,freq===20 ? "start" : (freq===20000 ? "end" : "middle"));
      }
    });
    addLabel("FREQUENCY (Hz)",165,210,"middle");
  }
  const curveStroke = layer.querySelector(".sq-curve-line, .neon-line-blue, .neon-line-emerald, .neon-line-peq");
  const firstNode = layer.querySelector(".screen-real-knob, [data-graph-node]");
  const insertionPoint = curveStroke || firstNode || null;
  if (insertionPoint) layer.insertBefore(group, insertionPoint);
  else layer.appendChild(group);
}

function updateGraphYAxisScale(targetPage = currentProcessorTab) {
  const graphIds = {
    preamp: "proc-page-preamp",
    hpf: "proc-page-hpf",
    gate: "proc-page-gate",
    peq: "proc-page-peq",
    comp: "proc-page-comp"
  };
  const page = targetPage === "limiter" ? "comp" : targetPage;
  const host = document.getElementById(graphIds[page]);
  const graphBox = host?.querySelector(".sq-graph-box") || host;
  const svg = graphBox?.querySelector("svg");
  if (!svg || !graphBox) return;
  drawBackgroundGrid(svg, graphBox, page);
  applyResponsiveGraphScale(graphBox);
}

function updateActiveProcessorUI() {
  updateGraphYAxisScale();
  let p = channelProcessors[currentFocusedChannel];
  let c = channelCompressors[currentFocusedChannel];
  if (!p || !c) return;

  const setTxt = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
  const isOut = !isInputChannel(currentFocusedChannel);

  // Bersihkan path sisa ghosting
  ["preamp", "hpf", "gate", "peq", "comp"].forEach(tabName => {
    const pageSvg = document.querySelector("#proc-page-" + tabName + " svg");
    if (pageSvg) {
      const validIds = new Set(["preamp-fill-path", "preamp-curve-path", "hpf-fill-path", "hpf-curve-path", "gate-fill-path", "gate-curve-path", "peq-fill-path", "peq-curve-path", "sq-fill-path", "sq-curve-path"]);
      pageSvg.querySelectorAll("path").forEach(pathEl => {
        if (!validIds.has(pathEl.id)) {
          pathEl.remove();
        }
      });
    }
  });

  if (currentProcessorTab === 'preamp') {
    setTxt("tc-val-pregaining", Number(p.pre_gain).toFixed(1) + " dB");
    setTxt("tc-val-prepad", p.pre_pad + " dB");
    setTxt("tc-val-phase", p.pre_phase === 1 ? "Inverted" : "Normal");
    updateKnobRotation("ind-pre-gain", p.pre_gain, -10, 60);
    updateKnobRotation("ind-pre-pad", p.pre_pad, -20, 0);
    updateKnobRotation("ind-pre-phase", p.pre_phase, 0, 1);

    // Gain input -10..+60 dB: posisi garis mengikuti skala Preamp.
    let posY = 10 + ((60 - Math.max(-10, Math.min(60, Number(p.pre_gain) || 0))) / 70) * 180;
    posY = Math.max(10, Math.min(190, posY));
    
    document.getElementById("node-preamp-group")?.setAttribute("transform", `translate(165, ${posY})`);
    document.getElementById("preamp-curve-path")?.setAttribute("d", `M 30 ${posY} L 300 ${posY}`);
    document.getElementById("preamp-fill-path")?.setAttribute("d", `M 30 ${posY} L 300 ${posY} L 300 190 L 30 190 Z`);
  } else if (currentProcessorTab === 'hpf') {
    setTxt("tc-val-hpffreq", Math.round(p.hpf_freq) + " Hz");
    setTxt("tc-val-hpfslope", p.hpf_slope + " dB/oct");
    setTxt("tc-val-lpffreq", Math.round(p.lpf_freq) + " Hz");
    setTxt("tc-val-lpfslope", p.lpf_slope + " dB/oct");
    updateKnobRotation("ind-hpf-freq", p.hpf_freq, 20, 1000);
    updateKnobRotation("ind-hpf-slope", p.hpf_slope, 6, 48);
    updateKnobRotation("ind-lpf-freq", p.lpf_freq, 100, 20000);
    updateKnobRotation("ind-lpf-slope", p.lpf_slope, 6, 48);

    const hpfFreq = Math.max(20, Number(p.hpf_freq) || 20);
    const hpfOrder = Math.max(1, Math.round((Number(p.hpf_slope) || 12) / 6));
    const hpfDb = f => {
      const ratio = Math.max(1e-6, f / hpfFreq);
      const mag = 1 / Math.sqrt(1 + Math.pow(1 / ratio, 2 * hpfOrder));
      return Math.max(-36, 20 * Math.log10(Math.max(1e-6, mag)));
    };
    const lpfFreq = Math.max(100, Number(p.lpf_freq) || 18000);
    const lpfDb = f => {
      const ratio = Math.max(1e-6, f / lpfFreq);
      const order = Math.max(1, Math.round((Number(p.lpf_slope) || 24) / 6));
      const mag = 1 / Math.sqrt(1 + Math.pow(ratio, 2 * order));
      return Math.max(-36, 20 * Math.log10(Math.max(1e-6, mag)));
    };
    // HPF/LPF response: 0 dB berada di atas, -36 dB di bawah.
    // Frekuensi cutoff berada pada sekitar -3 dB sesuai respons filter.
    const responseY = db => 10 + ((0 - Math.max(-36, Math.min(0, db))) / 36) * 180;
    
    const combinedPts = [];
    for (let i = 0; i <= 180; i++) {
      const x = 30 + 270 * i / 180;
      const f = 20 * Math.pow(1000, i / 180);
      const db = hpfDb(f) + lpfDb(f);
      combinedPts.push([x, Math.max(10, Math.min(190, responseY(db)))]);
    }
    const combinedD = combinedPts.map((pt, i) => (i ? "L" : "M") + pt[0].toFixed(2) + " " + pt[1].toFixed(2)).join(" ");
    
    const hpfX = 30 + 270 * (Math.log(hpfFreq / 20) / Math.log(1000));
    const lpfX = 30 + 270 * (Math.log(lpfFreq / 20) / Math.log(1000));
    const hpfY = responseY(hpfDb(hpfFreq) + lpfDb(hpfFreq));
    const lpfY = responseY(hpfDb(lpfFreq) + lpfDb(lpfFreq));

    document.getElementById("node-hpf-group")?.setAttribute("transform", `translate(${hpfX.toFixed(2)}, ${hpfY.toFixed(2)})`);
    document.getElementById("node-lpf-group")?.setAttribute("transform", `translate(${lpfX.toFixed(2)}, ${lpfY.toFixed(2)})`);

    // Garis cutoff dinamis: mengikuti frekuensi aktual, tetapi tidak mengambil alih sentuhan/drag.
    const hpfLayer = document.querySelector("#proc-page-hpf .sq-graph-box svg .graph-legacy-coordinate-layer");
    if (hpfLayer) {
      hpfLayer.querySelector("[data-hpf-cutoff-guides]")?.remove();
      const ns = "http://www.w3.org/2000/svg";
      const guides = document.createElementNS(ns, "g");
      guides.setAttribute("data-hpf-cutoff-guides", "true");
      guides.setAttribute("aria-hidden", "true");
      guides.style.pointerEvents = "none";
      const addGuide = (x, color, label) => {
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", x.toFixed(2));
        line.setAttribute("x2", x.toFixed(2));
        line.setAttribute("y1", "10");
        line.setAttribute("y2", "190");
        line.setAttribute("stroke", color);
        line.setAttribute("stroke-width", "1");
        line.setAttribute("stroke-dasharray", "3 3");
        line.setAttribute("opacity", "0.72");
        line.setAttribute("vector-effect", "non-scaling-stroke");
        guides.appendChild(line);
        const text = document.createElementNS(ns, "text");
        text.setAttribute("x", (x > 250 ? x - 4 : x + 4).toFixed(2));
        text.setAttribute("y", "18");
        text.setAttribute("text-anchor", x > 250 ? "end" : "start");
        text.setAttribute("fill", color);
        text.setAttribute("font-size", "7");
        text.setAttribute("font-family", "Arial, sans-serif");
        text.setAttribute("font-weight", "700");
        text.setAttribute("paint-order", "stroke");
        text.setAttribute("stroke", "#07101a");
        text.setAttribute("stroke-width", "1.8");
        text.setAttribute("stroke-linejoin", "round");
        text.textContent = label;
        guides.appendChild(text);
      };
      const fmtFreq = freq => freq < 1000 ? Math.round(freq) + " Hz" :
        (Number.isInteger(freq / 1000) ? String(freq / 1000) : (freq / 1000).toFixed(1)) + " kHz";
      addGuide(hpfX, "#36f4ff", "LOW CUT " + fmtFreq(hpfFreq));
      addGuide(lpfX, "#ff559e", "HIGH CUT " + fmtFreq(lpfFreq));
      const curve = hpfLayer.querySelector("#hpf-curve-path");
      hpfLayer.insertBefore(guides, curve || hpfLayer.firstChild);
    }

    document.getElementById("hpf-curve-path")?.setAttribute("d", combinedD);
    document.getElementById("hpf-fill-path")?.setAttribute("d", combinedD + " L 300 190 L 30 190 Z");
  } else if (currentProcessorTab === 'gate' && !isOut) {
    setTxt("tc-val-gatethr", Number(p.gate_thr).toFixed(1) + " dB");
    setTxt("tc-val-gaterng", Number(p.gate_rng).toFixed(1) + " dB");
    setTxt("tc-val-gateatk", Number(p.gate_atk).toFixed(1) + " ms");
    setTxt("tc-val-gaterel", Math.round(p.gate_rel) + " ms");
    updateKnobRotation("ind-gate-thr", p.gate_thr, -80, 0);
    updateKnobRotation("ind-gate-rng", p.gate_rng, -60, 0);
    updateKnobRotation("ind-gate-atk", p.gate_atk, 0.1, 100);
    updateKnobRotation("ind-gate-rel", p.gate_rel, 10, 1000);

    const gateThrRaw = Number(p.gate_thr);
    const gateRangeRaw = Number(p.gate_rng);
    const gateThr = Math.max(-80, Math.min(0, Number.isFinite(gateThrRaw) ? gateThrRaw : -45));
    const gateRange = Math.max(-60, Math.min(0, Number.isFinite(gateRangeRaw) ? gateRangeRaw : -40));
    const gx = v => 30 + (Math.max(-80, Math.min(0, v)) + 80) / 80 * 270;
    const gy = v => 10 + (0 - Math.max(-80, Math.min(0, v))) / 80 * 180;
    const gX = gx(gateThr);
    const floorDb = Math.max(-80, Math.min(0, gateThr + gateRange));
    const gY = Math.max(10, Math.min(190, gy(floorDb)));
    const thresholdY = Math.max(10, Math.min(190, gy(gateThr)));
    document.getElementById("node-gate-group")?.setAttribute("transform", `translate(${gX}, ${gY})`);
    
    // Di bawah threshold: redaman ke floor; di atas threshold: transfer 1:1.
    const gateCurveD = `M 30 ${gY.toFixed(2)} L ${gX.toFixed(2)} ${gY.toFixed(2)} L ${gX.toFixed(2)} ${thresholdY.toFixed(2)} L 300 10`;
    
    document.getElementById("gate-fill-path")?.setAttribute("d", `${gateCurveD} L 300 190 L 30 190 Z`);
    document.getElementById("gate-curve-path")?.setAttribute("d", gateCurveD);
  } else if (currentProcessorTab === 'peq') {
    const selectedBand = p.peq_bands[Math.max(0, Math.min(4, Number(p.peq_band) - 1))];
    if (selectedBand) { p.peq_freq = selectedBand.freq; p.peq_gain = selectedBand.gain; p.peq_q = selectedBand.q; }
    setTxt("tc-val-peqband", "Band " + p.peq_band);
    setTxt("tc-val-peqfreq", Math.round(p.peq_freq) + " Hz");
    setTxt("tc-val-peqgain", Number(p.peq_gain).toFixed(1) + " dB");
    setTxt("tc-val-peqq", Number(p.peq_q).toFixed(1) + " Q");
    updateKnobRotation("ind-peq-band", p.peq_band, 1, 5);
    updateKnobRotation("ind-peq-freq", p.peq_freq, 20, 20000);
    updateKnobRotation("ind-peq-gain", p.peq_gain, -12, 12);
    updateKnobRotation("ind-peq-q", p.peq_q, 0.1, 10);

    const peqBandDbAt = (band, freq) => {
      const bf = Math.max(20, Math.min(20000, Number(band.freq) || 1000));
      const bg = Math.max(-12, Math.min(12, Number(band.gain) || 0));
      const bq = Math.max(0.1, Math.min(10, Number(band.q) || 1.4));
      if (Math.abs(bg) < 1e-9) return 0;
      const A = Math.pow(10, bg / 40), w0 = 2 * Math.PI * bf / 48000;
      const alpha = Math.sin(w0) / (2 * bq), cw0 = Math.cos(w0);
      const b0 = 1 + alpha * A, b1 = -2 * cw0, b2 = 1 - alpha * A;
      const a0 = 1 + alpha / A, a1 = -2 * cw0, a2 = 1 - alpha / A;
      const w = 2 * Math.PI * freq / 48000, cw = Math.cos(w), sw = Math.sin(w);
      const nr = b0 + b1 * cw + b2 * Math.cos(2 * w);
      const ni = -b1 * sw - b2 * Math.sin(2 * w);
      const dr = a0 + a1 * cw + a2 * Math.cos(2 * w);
      const di = -a1 * sw - a2 * Math.sin(2 * w);
      const mag = Math.sqrt((nr * nr + ni * ni) / Math.max(1e-18, dr * dr + di * di));
      return 20 * Math.log10(Math.max(1e-9, mag));
    };
    const totalPeqDbAt = freq => p.peq_bands.reduce((sum, band) => sum + peqBandDbAt(band, freq), 0);
    const peqY = db => 190 - ((Math.max(-12, Math.min(12, db)) + 12) / 24) * 180;
    const peqPts = [];
    for (let i = 0; i <= 360; i++) {
      const x = 30 + 270 * i / 360;
      const freq = 20 * Math.pow(1000, i / 360);
      const db = Math.max(-12, Math.min(12, totalPeqDbAt(freq)));
      peqPts.push([x, peqY(db)]);
    }
    const peqD = peqPts.map((pt, i) => (i ? "L" : "M") + pt[0].toFixed(2) + " " + pt[1].toFixed(2)).join(" ");
    p.peq_bands.forEach((band, index) => {
      const node = document.getElementById("node-peq-band-" + (index + 1));
      if (!node) return;
      const freq = Math.max(20, Math.min(20000, Number(band.freq) || 1000));
      const nodeX = 30 + 270 * Math.log(freq / 20) / Math.log(1000);
      // Titik kontrol menunjukkan gain band ini sendiri. Kurva neon adalah
      // respons gabungan semua band, jadi garis boleh tidak melewati setiap titik.
      const bandGain = Math.max(-12, Math.min(12, Number(band.gain) || 0));
      const nodeY = peqY(bandGain);
      const bandColors = ["#36f4ff", "#ffd166", "#ff4d6d", "#b388ff", "#7dff8a"];
      const bandColor = bandColors[index];
      node.setAttribute("transform", `translate(${nodeX.toFixed(2)}, ${nodeY.toFixed(2)})`);
      const nodeCircle = node.querySelector("circle");
      nodeCircle?.setAttribute("stroke", "none");
      nodeCircle?.setAttribute("fill", bandColor + "88");
      nodeCircle?.setAttribute("r", "6");
      // Penanda putih berasal dari class is-selected, bukan pembesaran titik.
      node.style.color = bandColor;
      node.style.setProperty("--node-band-fill", bandColor + "88");
      node.style.setProperty("--node-active-fill", bandColor + "88");
      node.style.opacity = "1";
    });
    document.getElementById("peq-curve-path")?.setAttribute("d", peqD);
    document.getElementById("peq-fill-path")?.setAttribute("d", peqD + " L 300 100 L 30 100 Z");
  } else if (currentProcessorTab === 'geq') {
    updateGeqUI();
  } else if (currentProcessorTab === 'comp') {
    setTxt("lbl-atk", "Attack");
    setTxt("lbl-rel", "Release");
    setTxt("lbl-ratio", "Ratio");
    setTxt("lbl-thr", "Threshold");

    setTxt("tc-val-atk", Number(c.atk).toFixed(1) + " ms");
    setTxt("tc-val-rel", Math.round(c.rel) + " ms");
    setTxt("tc-val-ratio", Number(c.ratio).toFixed(1) + (isOut ? "" : ":1"));
    setTxt("tc-val-thr", Number(c.thr).toFixed(1) + " dB");
    updateKnobRotation("ind-active-atk", c.atk, 0.5, 100);
    updateKnobRotation("ind-active-rel", c.rel, 10, 1000);
    updateKnobRotation("ind-active-ratio", c.ratio, 1, 20);
    updateKnobRotation("ind-active-thr", c.thr, -60, 0);

    const compThrRaw = Number(c.thr);
    const compRatioRaw = Number(c.ratio);
    const compThr = Math.max(-60, Math.min(0, Number.isFinite(compThrRaw) ? compThrRaw : -30));
    const compRatio = Math.max(1, Number.isFinite(compRatioRaw) ? compRatioRaw : 1);
    const cx = v => 30 + (v + 60) / 60 * 270;
    const cy = v => 10 + (0 - Math.max(-60, Math.min(0, v))) / 60 * 180;
    const thrX = cx(compThr), threshY = cy(compThr);
    const outAtZero = Math.max(-60, Math.min(0, compThr + (0 - compThr) / compRatio));
    const endY = cy(outAtZero);
    const compD = `M 30 ${cy(-60)} L ${thrX.toFixed(2)} ${threshY.toFixed(2)} L 300 ${endY.toFixed(2)}`;
    document.getElementById("sq-curve-path")?.setAttribute("d", compD);
    document.getElementById("sq-fill-path")?.setAttribute("d", compD + " L 300 190 L 30 190 Z");
    document.getElementById("node-thresh-group")?.setAttribute("transform", `translate(${thrX}, ${threshY})`);

    updateThumbnailCurve(currentFocusedChannel, thrX, threshY, endY);
  }

  let mainFader = document.getElementById("gain-" + currentFocusedChannel);
  if (mainFader) {
    let val = parseFloat(mainFader.value);
    setTxt("tc-val-mastergain", Number(val).toFixed(1) + " dB");
    updateKnobRotation("ind-master-gain", val, -40, isInputChannel(currentFocusedChannel) ? 20 : 12);
  }
}

function initKnobEventListeners() {
  const selector = ".physical-knob-container[data-knob-param], .tc-master-strip[data-knob-param]";
  document.querySelectorAll(selector).forEach(knob => {
    if (knob.dataset.knobListenerReady === "1") return;
    knob.dataset.knobListenerReady = "1";
    knob.style.pointerEvents = "auto";
    knob.style.touchAction = "none";
    knob.style.userSelect = "none";
    knob.style.webkitUserSelect = "none";
    const start = event => {
      if (event.target && event.target.closest && !event.target.closest(selector)) return;
      initKnobDrag(event, knob.dataset.knobParam,
        Number(knob.dataset.knobMin), Number(knob.dataset.knobMax), Number(knob.dataset.knobStep));
    };
    knob.addEventListener("pointerdown", start, { passive: false });
  });
}

function initKnobDrag(e, paramKey, min, max, step) {
  if (!e || e.type !== "pointerdown" || (e.pointerType === "mouse" && e.button !== 0)) return;
  e.preventDefault();
  e.stopPropagation();
  const channelId = dlmsState.activeChannel;
  const startY = Number(e.clientY);
  const startVal = Number(getParamValue(paramKey, channelId));
  const lo = Number(min), hi = Number(max);
  const range = Math.max(0, hi - lo);
  const safeStep = Math.max(0, Number(step) || 0);
  const target = e.currentTarget;
  const pointerId = e.pointerId;
  let finished = false;
  if (!Number.isFinite(startY) || !Number.isFinite(startVal) || !Number.isFinite(lo) || !Number.isFinite(hi)) return;
  try { target?.setPointerCapture?.(pointerId); } catch (err) {}

  function onMove(moveEvent) {
    if (finished) return;
    if (moveEvent.pointerId !== pointerId) return;
    const y = Number(moveEvent.clientY);
    if (!Number.isFinite(y)) return;
    moveEvent.preventDefault();
    const knobRect = target?.getBoundingClientRect?.();
    const dragHeight = Math.max(24, Number(knobRect?.height) || 32);
    const sensitivity = range / (dragHeight * 2);
    let value = Math.max(lo, Math.min(hi, startVal + (startY - y) * sensitivity));
    if (safeStep > 0) value = Number((lo + Math.round((value - lo) / safeStep) * safeStep).toFixed(4));
    value = Math.max(lo, Math.min(hi, value));
    if (!Number.isFinite(value)) return;
    setParamValue(paramKey, value, channelId);
    if (channelId === dlmsState.activeChannel) scheduleAppRender();
    updateParam(paramKey + "_" + channelId, value);
  }
  function finish(endEvent) {
    if (finished) return;
    if (endEvent && endEvent.pointerId != null && endEvent.pointerId !== pointerId) return;
    finished = true;
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", finish);
    window.removeEventListener("pointercancel", finish);
    try { if (target?.hasPointerCapture?.(pointerId)) target.releasePointerCapture(pointerId); } catch (err) {}
  }
  window.addEventListener("pointermove", onMove, { passive: false });
  window.addEventListener("pointerup", finish);
  window.addEventListener("pointercancel", finish);
}

function getParamValue(key, channelId = dlmsState.activeChannel) {
  const state = getChannelState(channelId);
  if (!state) return 0;
  let c = state.compressor;
  let p = state.processor;
  if (key === 'active-atk') return c.atk;
  if (key === 'active-rel') return c.rel;
  if (key === 'active-ratio') return c.ratio;
  if (key === 'active-thr') return c.thr;
  if (key === 'active-gain') return c.gain;
  if (key === 'active-mix') return c.mix;
  if (key === 'pre-gain') return p.pre_gain;
  if (key === 'pre-pad') return p.pre_pad;
  if (key === 'pre-phase') return p.pre_phase;
  if (key === 'hpf-freq') return p.hpf_freq;
  if (key === 'hpf-slope') return p.hpf_slope;
  if (key === 'lpf-freq') return p.lpf_freq;
  if (key === 'lpf-slope') return p.lpf_slope;
  if (key === 'gate-thr') return p.gate_thr;
  if (key === 'gate-rng') return p.gate_rng;
  if (key === 'gate-atk') return p.gate_atk;
  if (key === 'gate-rel') return p.gate_rel;
  if (key === 'peq-band') return p.peq_band;
  if (key === 'peq-freq') return p.peq_freq;
  if (key === 'peq-gain') return p.peq_gain;
  if (key === 'peq-q') return p.peq_q;
  if (key === 'master-gain') return state.gain;
  return 0;
}

function setParamValue(key, val, channelId = dlmsState.activeChannel) {
  const state = getChannelState(channelId);
  if (!state) return;
  let c = state.compressor;
  let p = state.processor;
  if (key === 'active-atk') c.atk = val;
  else if (key === 'active-rel') c.rel = val;
  else if (key === 'active-ratio') c.ratio = val;
  else if (key === 'active-thr') c.thr = val;
  else if (key === 'active-gain') c.gain = val;
  else if (key === 'active-mix') c.mix = val;
  else if (key === 'pre-gain') p.pre_gain = val;
  else if (key === 'pre-pad') p.pre_pad = val;
  else if (key === 'pre-phase') p.pre_phase = val;
  else if (key === 'hpf-freq') p.hpf_freq = val;
  else if (key === 'hpf-slope') p.hpf_slope = val;
  else if (key === 'lpf-freq') p.lpf_freq = val;
  else if (key === 'lpf-slope') p.lpf_slope = val;
  else if (key === 'gate-thr') p.gate_thr = val;
  else if (key === 'gate-rng') p.gate_rng = val;
  else if (key === 'gate-atk') p.gate_atk = val;
  else if (key === 'gate-rel') p.gate_rel = val;
  else if (key === 'peq-band') {
    p.peq_band = Math.max(1, Math.min(5, Math.round(Number(val) || 1)));
    const band = p.peq_bands[p.peq_band - 1];
    if (band) { p.peq_freq = band.freq; p.peq_gain = band.gain; p.peq_q = band.q; }
  }
  else if (key === 'peq-freq') {
    p.peq_freq = Number(val);
    if (p.peq_bands[p.peq_band - 1]) p.peq_bands[p.peq_band - 1].freq = p.peq_freq;
  }
  else if (key === 'peq-gain') {
    p.peq_gain = Number(val);
    if (p.peq_bands[p.peq_band - 1]) p.peq_bands[p.peq_band - 1].gain = p.peq_gain;
  }
  else if (key === 'peq-q') {
    p.peq_q = Number(val);
    if (p.peq_bands[p.peq_band - 1]) p.peq_bands[p.peq_band - 1].q = p.peq_q;
  }
  else if (key === 'master-gain') {
    state.gain = Number(val);
    const mainFader = document.getElementById("gain-" + channelId);
    if (mainFader) mainFader.value = String(val);
    updateFaderLabel(channelId, val);
  }
}

function updateThumbnailCurve(id, tx, ty, ey) {
  const miniPath = document.getElementById("mini-curve-" + id);
  if (!miniPath) return;
  let pThreshX = (tx / 320) * 100;
  let pThreshY = (ty / 210) * 40;
  let pEndY = (ey / 210) * 40;
  miniPath.setAttribute("d", `M 0 40 L ${pThreshX} ${pThreshY} L 100 ${pEndY}`);
}

const GRAPH_COORD_WIDTH = 600;
const GRAPH_COORD_HEIGHT = 350;

function getNormalizedCoords(event, element) {
  if (!event || !element) return null;
  const rect = element.getBoundingClientRect();
  if (!rect || rect.width <= 0 || rect.height <= 0) return null;
  const source = event.touches?.[0] || event.changedTouches?.[0] || event;
  const clientX = Number(source.clientX);
  const clientY = Number(source.clientY);
  if (!Number.isFinite(clientX) || !Number.isFinite(clientY)) return null;

  // Normalisasi presisi tinggi sesuai viewBox
  const rawX = ((clientX - rect.left) / rect.width) * GRAPH_COORD_WIDTH;
  const rawY = ((clientY - rect.top) / rect.height) * GRAPH_COORD_HEIGHT;
  return { x: rawX, y: rawY };
}

function getGraphScaleFactor(host) {
  const rect=host?.getBoundingClientRect?.();
  const width=Math.max(1,rect?.width || GRAPH_COORD_WIDTH);
  const height=Math.max(1,rect?.height || GRAPH_COORD_HEIGHT);
  let baseScale=Math.min(width/GRAPH_COORD_WIDTH,height/GRAPH_COORD_HEIGHT);
  return Math.max(0.35,Math.min(1.25,baseScale));
}

function initGraphGlowLayers(svg) {
  if (!svg || svg.dataset.glowLayersReady==="1") return;
  svg.dataset.glowLayersReady="1";
  const selector=".sq-curve-line, .neon-line-blue, .neon-line-emerald, .neon-line-peq";
  const colors={"sq-curve-line":"#ffd15c","neon-line-blue":"#36f4ff","neon-line-emerald":"#3dffd0","neon-line-peq":"#ff559e"};
  const sync=path=>{
    if(!path || !path.parentNode) return;
    const color=Array.from(path.classList).map(name=>colors[name]).find(Boolean) || "#36f4ff";
    let glow=path.previousElementSibling;
    if(!glow || glow.getAttribute("data-dlms-glow-for")!==(path.id || "")) {
      glow=path.ownerDocument.createElementNS("http://www.w3.org/2000/svg","path");
      glow.setAttribute("data-dlms-glow-for",path.id || "");
      glow.setAttribute("class","dlms-curve-glow");
      glow.setAttribute("fill","none");
      glow.setAttribute("stroke-linecap","round");
      glow.setAttribute("stroke-linejoin","round");
      glow.setAttribute("vector-effect","non-scaling-stroke");
      glow.setAttribute("pointer-events","none");
      glow.setAttribute("aria-hidden","true");
      path.parentNode.insertBefore(glow,path);
    }
    glow.setAttribute("d",path.getAttribute("d") || "");
    glow.setAttribute("stroke",color);
  };
  svg.querySelectorAll(selector).forEach(sync);
  if(typeof MutationObserver!=="undefined") {
    const observer=new MutationObserver(records=>{
      new Set(records.map(record=>record.target).filter(node=>node.matches?.(selector))).forEach(sync);
    });
    svg.querySelectorAll(selector).forEach(path=>observer.observe(path,{attributes:true,attributeFilter:["d","class"]}));
    svg.__dlmsGlowObserver=observer;
  }
  // Titik kontrol dibuat satu lingkaran; tidak menambahkan halo duplikat.
}

function applyResponsiveGraphScale(host) {
  if(!host) return;
  const scaleFactor=getGraphScaleFactor(host);
  host.style.setProperty("--graph-scale",String(scaleFactor));
  const svg=host.matches("svg") ? host : host.querySelector("svg");
  if(!svg) return;
  initGraphGlowLayers(svg);
  svg.querySelectorAll(".sq-curve-line, .neon-line-blue, .neon-line-emerald, .neon-line-peq").forEach(path=>{
    path.style.strokeWidth=(3.5*scaleFactor).toFixed(3)+"px";
    path.style.filter="none";
    const glow=path.previousElementSibling;
    if(glow?.classList.contains("dlms-curve-glow")) {
      glow.style.strokeWidth=(8*scaleFactor).toFixed(3)+"px";
      glow.style.opacity="0.16";
    }
  });
  svg.querySelectorAll(".sq-grid-line, .zero-fixed-line").forEach(line=>{
    line.style.strokeWidth=Math.max(0.5,0.75*scaleFactor).toFixed(3)+"px";
    line.style.stroke="rgba(255,255,255,0.08)";
    line.style.opacity="1";
  });
  svg.querySelectorAll(".sq-grid-text").forEach(label=>{
    label.style.fontSize=Math.max(6.5,7.2*scaleFactor).toFixed(3)+"px";
    label.style.fill="rgba(255,255,255,0.45)";
    label.style.stroke="none";
    label.style.paintOrder="normal";
  });
}

function initResponsiveGraphScaling() {
  const hosts = Array.from(document.querySelectorAll(".sq-graph-box, #geq-container-box"));
  hosts.forEach(applyResponsiveGraphScale);
  if (typeof ResizeObserver !== "undefined" && !window.__dlmsGraphScaleObserver) {
    window.__dlmsGraphScaleObserver = new ResizeObserver(entries => {
      entries.forEach(entry => applyResponsiveGraphScale(entry.target));
    });
    hosts.forEach(host => window.__dlmsGraphScaleObserver.observe(host));
  }
}

function preventDSPGraphPinchZoom() {
  const graphSelector = ".sq-graph-box, #gate-graph-box, #comp-graph-box, #geq-container-box";
  ["gesturestart", "gesturechange", "gestureend"].forEach(type => {
    document.addEventListener(type, event => {
      const target = event.target;
      if (target instanceof Element && target.closest(graphSelector)) {
        event.preventDefault();
      }
    }, { passive: false, capture: true });
  });
}

function handleGraphMove(e, tab, dragNode, box, svg, channelId = dlmsState.activeChannel) {
  const graph = svg || (box && box.querySelector("svg"));
  if (!graph) return;

  // Ambil posisi sentuh menggunakan matriks SVG sebenar. Ini mengelakkan
  // titik bergerak terlalu maju/naik akibat skala atau bingkai responsif.
  let svgX, svgY;
  // Selalu konversi dari layar ke koordinat viewBox SVG utama terlebih dahulu.
  // Jangan memakai CTM grup kurva secara langsung: transformasi grup pada HPF
  // dapat membuat posisi sentuh tampak maju/mundur pada beberapa ukuran layar.
  const screenMatrix = graph.getScreenCTM?.();
  if (screenMatrix && typeof graph.createSVGPoint === "function") {
    const point = graph.createSVGPoint();
    point.x = Number(e.clientX);
    point.y = Number(e.clientY);
    // HPF memakai transformasi koordinat pada layer grafik. Petakan sentuhan
    // langsung ke sistem koordinat layer tersebut agar frekuensi tidak meloncat
    // pada layar responsif; titik LOW CUT/HIGH CUT hanya membaca sumbu X.
    const hpfLayer = tab === "hpf" ? graph.querySelector(".graph-legacy-coordinate-layer") : null;
    const layerMatrix = hpfLayer?.getScreenCTM?.();
    if (layerMatrix) {
      const layerPoint = point.matrixTransform(layerMatrix.inverse());
      svgX = layerPoint.x;
      svgY = layerPoint.y;
    } else {
      const viewPoint = point.matrixTransform(screenMatrix.inverse());
      if (tab === "peq") {
        svgX = viewPoint.x;
        svgY = viewPoint.y;
      } else {
        // Balikkan skala layer grafik lama untuk halaman selain PEQ/HPF.
        svgX = viewPoint.x / 1.8181818;
        svgY = viewPoint.y / 1.6277778;
      }
    }
  } else {
    const rect = graph.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const viewX = ((Number(e.clientX) - rect.left) / rect.width) * (tab === "peq" ? 330 : 600);
    const viewY = ((Number(e.clientY) - rect.top) / rect.height) * (tab === "peq" ? 215 : 350);
    svgX = tab === "peq" ? viewX : viewX / 1.8181818;
    svgY = tab === "peq" ? viewY : viewY / 1.6277778;
  }
  if (!Number.isFinite(svgX) || !Number.isFinite(svgY)) return;
  svgX = Math.max(30, Math.min(300, svgX));
  svgY = Math.max(10, Math.min(190, svgY));
  const normalizedX = Math.max(0, Math.min(1, (svgX - 30) / 270));
  const normalizedY = Math.max(0, Math.min(1, (svgY - 10) / 180));

  const state = getChannelState(channelId);
  if (!state) return;
  const p = state.processor;
  const c = state.compressor;

  if (tab === "preamp") {
    const mappedGain = -10 + (1 - normalizedY) * 70;
    p.pre_gain = Number(Math.max(-10, Math.min(60, mappedGain)).toFixed(1));
    updateParam("pre-gain_" + channelId, p.pre_gain);
  } else if (tab === "comp") {
    const mappedThr = -60 + normalizedX * 60;
    c.thr = Number(Math.max(-60, Math.min(0, mappedThr)).toFixed(1));
    updateParam("active-thr_" + channelId, c.thr);
  } else if (tab === "hpf") {
    const isLPF = dragNode === "lpf";
    // Sumbu X grafik selalu logaritmik 20 Hz–20 kHz.
    // HPF dibatasi 20–1000 Hz; LPF dibatasi 100–20000 Hz.
    // Saat node digeser melewati batasnya, nilainya berhenti di batas,
    // tidak membalik arah atau mengubah skala grafik.
    const minFreq = isLPF ? 100 : 20;
    const maxFreq = isLPF ? 20000 : 1000;
    const mappedFreq = 20 * Math.pow(1000, normalizedX);
    if (!Number.isFinite(mappedFreq) || mappedFreq <= 0) return;
    const boundedFreq = Math.round(Math.max(minFreq, Math.min(maxFreq, mappedFreq)));
    if (isLPF) {
      p.lpf_freq = boundedFreq;
      updateParam("lpf-freq_" + channelId, p.lpf_freq);
    } else {
      p.hpf_freq = boundedFreq;
      updateParam("hpf-freq_" + channelId, p.hpf_freq);
    }
  } else if (tab === "gate") {
    // Posisi X menentukan threshold; posisi Y menentukan level akhir (threshold + range).
    // Jangan merata-ratakan X dan Y menjadi threshold karena itu membuat knop meloncat diagonal.
    const mappedThr = -80 + normalizedX * 80;
    const mappedFloor = -((svgY - 10) / 180) * 80;
    p.gate_thr = Number(Math.max(-80, Math.min(0, mappedThr)).toFixed(1));
    p.gate_rng = Number(Math.max(-60, Math.min(0, mappedFloor - p.gate_thr)).toFixed(1));
    updateParam("gate-thr_" + channelId, p.gate_thr);
    updateParam("gate-rng_" + channelId, p.gate_rng);
  } else if (tab === "peq") {
    const bandIndex = Math.max(0, Math.min(4, (Number(dragNode) || p.peq_band) - 1));
    p.peq_band = bandIndex + 1;
    const band = p.peq_bands[bandIndex];
    const minFreq = 20, maxFreq = 20000;
    const mappedFreq = minFreq * Math.pow(maxFreq / minFreq, normalizedX);
    const mappedGain = 12 - normalizedY * 24;
    if (!Number.isFinite(mappedFreq) || mappedFreq <= 0 || !Number.isFinite(mappedGain)) return;
    band.freq = Math.round(Math.max(minFreq, Math.min(maxFreq, mappedFreq)));
    // Hanya parameter band yang dipilih yang berubah; band lain tetap independen.
    band.gain = Number(Math.max(-12, Math.min(12, mappedGain)).toFixed(1));
    p.peq_freq = band.freq; p.peq_gain = band.gain; p.peq_q = band.q;
    updateParam("peq-band_" + channelId, p.peq_band);
    updateParam("peq-freq_" + channelId, p.peq_freq);
    updateParam("peq-gain_" + channelId, p.peq_gain);
  }

  // Reflow buffer pembersihan ghosting
  if (graph) {
    graph.style.transform = "translateZ(0)";
    requestAnimationFrame(() => {
      graph.style.transform = "none";
    });
  }
}

function initInteractiveGraphs() {
  ["preamp", "hpf", "gate", "peq", "comp"].forEach(tab => {
    const box = document.getElementById(tab + "-graph-box");
    if (!box || box.dataset.graphPointerReady === "1") return;

    const svgNodes = Array.from(box.querySelectorAll("svg"));
    const svg = svgNodes[0];
    if (!svg) return;
    svgNodes.slice(1).forEach(node => node.remove());
    const seenIds = new Set();
    svg.querySelectorAll("[id]").forEach(node => {
      if (seenIds.has(node.id)) node.remove();
      else seenIds.add(node.id);
    });
    box.dataset.graphPointerReady = "1";

    box.style.touchAction = "none";
    box.style.userSelect = "none";
    box.style.webkitUserSelect = "none";

    let isDragging = false;
    let activeDragNode = null;
    let activePointerId = null;
    let activeChannelId = null;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartPreampGain = 0;
    let dragStartFrequency = 0;
    let dragStartPeqGain = 0;

    function onPointerDown(e) {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      let pickedNode = null;
      const clientX = Number(e.clientX);
      const clientY = Number(e.clientY);
      const screenDistance = (element) => {
        if (!element || element.style.display === "none") return Infinity;
        const r = element.getBoundingClientRect();
        if (!r.width && !r.height) return Infinity;
        return Math.hypot(clientX - (r.left + r.width / 2), clientY - (r.top + r.height / 2));
      };

      if (tab === "preamp") {
        const r = svg.getBoundingClientRect();
        if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) pickedNode = "preamp";
      } else if (tab === "comp") {
        if (screenDistance(svg.querySelector("#node-thresh-group")) <= 40) pickedNode = "threshold";
      } else if (tab === "gate") {
        if (screenDistance(svg.querySelector("#node-gate-group")) <= 40) pickedNode = "gate";
      } else if (tab === "hpf") {
        const markers = [
          { id: "hpf", el: svg.querySelector("#node-hpf-group") },
          { id: "lpf", el: svg.querySelector("#node-lpf-group") }
        ];
        const nearest = markers.map(item => ({ id: item.id, distance: screenDistance(item.el) }))
          .filter(item => Number.isFinite(item.distance))
          .sort((a, b) => a.distance - b.distance)[0];
        if (nearest && nearest.distance <= 40) pickedNode = nearest.id;
      } else if (tab === "peq") {
        const nearest = Array.from(svg.querySelectorAll("[data-peq-band]"))
          .map(node => ({ id: node.dataset.peqBand, distance: screenDistance(node) }))
          .sort((a, b) => a.distance - b.distance)[0];
        if (nearest && nearest.distance <= 45) pickedNode = nearest.id;
      }

      if (!pickedNode) return;

      e.preventDefault();
      svg.querySelectorAll(".screen-real-knob.is-selected").forEach(node => node.classList.remove("is-selected"));
      const selectedNode = pickedNode === "hpf" ? svg.querySelector("#node-hpf-group")
        : pickedNode === "lpf" ? svg.querySelector("#node-lpf-group")
        : pickedNode === "gate" ? svg.querySelector("#node-gate-group")
        : pickedNode === "threshold" ? svg.querySelector("#node-thresh-group")
        : /^[1-5]$/.test(String(pickedNode)) ? svg.querySelector("#node-peq-band-" + pickedNode) : null;
      if (selectedNode) selectedNode.classList.add("is-selected");
      activeDragNode = pickedNode;
      activeChannelId = dlmsState.activeChannel;
      isDragging = true;
      activePointerId = e.pointerId;
      dragStartX = clientX;
      dragStartY = clientY;
      const startProcessor = getChannelState(activeChannelId)?.processor;
      dragStartPreampGain = Number(startProcessor?.pre_gain ?? 0);
      if (tab === "hpf" && startProcessor) {
        dragStartFrequency = Number(activeDragNode === "lpf" ? startProcessor.lpf_freq : startProcessor.hpf_freq) || 20;
      } else if (tab === "peq" && startProcessor) {
        const bandIndex = Math.max(0, Math.min(4, Number(activeDragNode) - 1));
        dragStartFrequency = Number(startProcessor.peq_bands?.[bandIndex]?.freq) || 1000;
        dragStartPeqGain = Number(startProcessor.peq_bands?.[bandIndex]?.gain) || 0;
      }

      // Simpan offset dari pusat node supaya sentuhan tidak membuat titik meloncat.
      const dragRect = selectedNode?.getBoundingClientRect?.();
      const hasNodeCenter = dragRect && (dragRect.width || dragRect.height);
      const dragOffsetX = hasNodeCenter ? clientX - (dragRect.left + dragRect.width / 2) : 0;
      const dragOffsetY = hasNodeCenter ? clientY - (dragRect.top + dragRect.height / 2) : 0;
      svg.dataset.dragOffsetX = String(dragOffsetX);
      svg.dataset.dragOffsetY = String(dragOffsetY);
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    }

    function onPointerMove(e) {
      if (!isDragging || e.pointerId !== activePointerId) return;
      e.preventDefault();

      // Pada layar sentuh, browser dapat menggabungkan beberapa pergeseran.
      // Ambil koordinat gerakan paling baru agar titik mengikuti jari secara kontinu.
      let point = e;
      if (typeof e.getCoalescedEvents === "function") {
        const samples = e.getCoalescedEvents();
        if (samples && samples.length) point = samples[samples.length - 1];
      }
      if (tab === "hpf" || tab === "peq") {
        // HPF/PEQ digerakkan relatif dari nilai awal, bukan dipetakan ulang dari
        // posisi vertikal kurva. Ini mencegah titik meloncat ketika disentuh.
        const rect = svg.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const state = getChannelState(activeChannelId);
        if (!state) return;
        const dx = point.clientX - dragStartX;
        const dy = point.clientY - dragStartY;
        if (tab === "hpf") {
          const isLPF = activeDragNode === "lpf";
          const minFreq = isLPF ? 100 : 20;
          const maxFreq = isLPF ? 20000 : 1000;
          // Area plot HPF menggunakan 540 unit dari viewBox 600.
          const logSpan = Math.log(20000 / 20);
          const deltaLog = (dx / rect.width) * (600 / (1.8181818 * 270)) * logSpan;
          const freq = Math.max(minFreq, Math.min(maxFreq, dragStartFrequency * Math.exp(deltaLog)));
          if (isLPF) {
            state.processor.lpf_freq = Math.round(freq);
            updateParam("lpf-freq_" + activeChannelId, state.processor.lpf_freq);
          } else {
            state.processor.hpf_freq = Math.round(freq);
            updateParam("hpf-freq_" + activeChannelId, state.processor.hpf_freq);
          }
        } else {
          const bandIndex = Math.max(0, Math.min(4, Number(activeDragNode) - 1));
          const band = state.processor.peq_bands?.[bandIndex];
          if (!band) return;
          const deltaLog = (dx / rect.width) * (330 / 270) * Math.log(20000 / 20);
          const freq = Math.max(20, Math.min(20000, dragStartFrequency * Math.exp(deltaLog)));
          const gainDelta = -(dy / rect.height) * (215 / 180) * 24;
          band.freq = Math.round(freq);
          band.gain = Number(Math.max(-12, Math.min(12, dragStartPeqGain + gainDelta)).toFixed(1));
          state.processor.peq_band = bandIndex + 1;
          state.processor.peq_freq = band.freq;
          state.processor.peq_gain = band.gain;
          state.processor.peq_q = band.q;
          updateParam("peq-band_" + activeChannelId, state.processor.peq_band);
          updateParam("peq-freq_" + activeChannelId, state.processor.peq_freq);
          updateParam("peq-gain_" + activeChannelId, state.processor.peq_gain);
        }
        scheduleAppRender();
        return;
      }
      if (tab === "preamp") {
        // PREAMP tidak memiliki node kontrol tersendiri: ubah gain relatif terhadap
        // posisi awal jari agar ketukan/awal geser tidak memindahkan kurva ke nilai lain.
        const rect = svg.getBoundingClientRect();
        if (!rect.height) return;
        const deltaGain = ((dragStartY - point.clientY) / rect.height) * (GRAPH_COORD_HEIGHT / 1.6277778) * (70 / 180);
        const state = getChannelState(activeChannelId);
        if (state) {
          state.processor.pre_gain = Number(Math.max(-10, Math.min(60, dragStartPreampGain + deltaGain)).toFixed(1));
          updateParam("pre-gain_" + activeChannelId, state.processor.pre_gain);
          scheduleAppRender();
        }
        return;
      }
      const offsetX = Number(svg.dataset.dragOffsetX) || 0;
      const offsetY = Number(svg.dataset.dragOffsetY) || 0;
      scheduleAppRender({
        event: { clientX: point.clientX - offsetX, clientY: point.clientY - offsetY },
        tab,
        dragNode: activeDragNode,
        box,
        svg,
        channelId: activeChannelId
      });
    }

    function onPointerEnd(e) {
      if (e.pointerId !== activePointerId) return;
      isDragging = false;
      activeDragNode = null;
      activePointerId = null;
      activeChannelId = null;
      svg.querySelectorAll(".screen-real-knob.is-selected").forEach(node => node.classList.remove("is-selected"));
      try { if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); } catch (err) {}
    }

    svg.style.pointerEvents = "auto";
    svg.style.touchAction = "none";
    svg.style.cursor = "crosshair";
    svg.addEventListener("pointerdown", onPointerDown, { passive: false });
    svg.addEventListener("pointermove", onPointerMove, { passive: false });
    svg.addEventListener("pointerup", onPointerEnd);
    svg.addEventListener("pointercancel", onPointerEnd);
    svg.addEventListener("lostpointercapture", onPointerEnd);
  });
}

function focusChannel(id) {
  if (!channelIds.includes(id)) return;
  currentFocusedChannel = id;
  dlmsState.activeChannel = id;
  channelIds.forEach(ch => {
    document.getElementById("strip-" + ch)?.classList.remove("focused");
  });
  document.getElementById("strip-" + id)?.classList.add("focused");

  const chLabel = document.getElementById("active-ch-label");
  if (chLabel) chLabel.textContent = channelNames[id];

  const mainFader = document.getElementById("gain-" + id);
  if (mainFader) {
    mainFader.max = isInputChannel(id) ? "20" : "12";
  }

  updateSidebarForChannel(id);
  switchProcessorPage('preamp');

  const btnOn = document.getElementById("on-" + id);
  const tcPower = document.getElementById("tc-power-btn");
  if (btnOn && tcPower) {
    let isOn = !btnOn.classList.contains("off");
    tcPower.classList.toggle("off", !isOn);
    tcPower.textContent = isOn ? "IN (ACTIVE)" : "BYPASS";
  }

  updateActiveProcessorUI();
}

function toggleActivePower() {
