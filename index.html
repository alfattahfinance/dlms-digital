v class="fader-workspace">
            <div class="section-group-title">DSP Mixer Matrix</div>
            
            <div class="mixer-bank">
                
                <!-- Channel In A -->
                <div class="channel-strip">
                    <div class="ch-name">In A</div>
                    <div class="ch-sublabel">Main</div>
                    <div class="db-value" id="val-ina">0.0 dB</div>
                    <div class="fader-meter-area">
                        <div class="vertical-slider-container">
                            <input type="range" class="vertical-fader" id="gain-ina" min="-40" max="12" step="0.5" value="0" oninput="updateGain('ina')">
                        </div>
                        <div class="vu-meter"><div class="vu-fill" style="height: 65%;"></div></div>
                    </div>
                    <button class="strip-btn" id="mute-ina" onclick="toggleMute('ina')">MUTE</button>
                </div>

                <!-- Channel In B -->
                <div class="channel-strip">
                    <div class="ch-name">In B</div>
                    <div class="ch-sublabel">Aux</div>
                    <div class="db-value" id="val-inb">0.0 dB</div>
                    <div class="fader-meter-area">
                        <div class="vertical-slider-container">
                            <input type="range" class="vertical-fader" id="gain-inb" min="-40" max="12" step="0.5" value="0" oninput="updateGain('inb')">
                        </div>
                        <div class="vu-meter"><div class="vu-fill" style="height: 55%;"></div></div>
                    </div>
                    <button class="strip-btn" id="mute-inb" onclick="toggleMute('mute-inb')">MUTE</button>
                </div>

                <!-- Channel Out 1 (Sub) -->
                <div class="channel-strip">
                    <div class="ch-name">Out 1</div>
                    <div class="ch-sublabel">Sub</div>
                    <div class="db-value" id="val-out1">0.0 dB</div>
                    <div class="fader-meter-area">
                        <div class="vertical-slider-container">
                            <input type="range" class="vertical-fader" id="gain-out1" min="-40" max="6" step="0.5" value="0" oninput="updateGain('out1')">
                        </div>
                        <div class="vu-meter"><div class="vu-fill" style="height: 75%;"></div></div>
                    </div>
                    <button class="strip-btn" id="mute-out1" onclick="toggleMute('out1')">MUTE</button>
                </div>

                <!-- Channel Out 2 (Low) -->
                <div class="channel-strip">
                    <div class="ch-name">Out 2</div>
                    <div class="ch-sublabel">Low</div>
                    <div class="db-value" id="val-out2">0.0 dB</div>
                    <div class="fader-meter-area">
                        <div class="vertical-slider-container">
                            <input type="range" class="vertical-fader" id="gain-out2" min="-40" max="6" step="0.5" value="0" oninput="updateGain('out2')">
                        </div>
                        <div class="vu-meter"><div class="vu-fill" style="height: 60%;"></div></div>
                    </div>
                    <button class="strip-btn" id="mute-out2" onclick="toggleMute('out2')">MUTE</button>
                </div>

                <!-- Channel Out 3 (Mid) -->
                <div class="channel-strip">
                    <div class="ch-name">Out 3</div>
                    <div class="ch-sublabel">Mid</div>
                    <div class="db-value" id="val-out3">0.0 dB</div>
                    <div class="fader-meter-area">
                        <div class="vertical-slider-container">
                            <input type="range" class="vertical-fader" id="gain-out3" min="-40" max="6" step="0.5" value="0" oninput="updateGain('out3')">
                        </div>
                        <div class="vu-meter"><div class="vu-fill" style="height: 55%;"></div></div>
                    </div>
                    <button class="strip-btn" id="mute-out3" onclick="toggleMute('out3')">MUTE</button>
                </div>

                <!-- Channel Out 4 (High) -->
                <div class="channel-strip">
                    <div class="ch-name">Out 4</div>
                    <div class="ch-sublabel">High</div>
                    <div class="db-value" id="val-out4">0.0 dB</div>
                    <div class="fader-meter-area">
                        <div class="vertical-slider-container">
                            <input type="range" class="vertical-fader" id="gain-out4" min="-40" max="6" step="0.5" value="0" oninput="updateGain('out4')">
                        </div>
                        <div class="vu-meter"><div class="vu-fill" style="height: 45%;"></div></div>
                    </div>
                    <button class="strip-btn" id="mute-out4" onclick="toggleMute('out4')">MUTE</button>
                </div>

            </div>
        </div>

        <!-- Footer -->
        <div class="app-footer">
            <span>ESP32 UDP Protocol Active</span>
            <span>UI v1.9</span>
        </div>

    </div>

    <script>
        function updateGain(id) {
            const slider = document.getElementById('gain-' + id);
            const label = document.getElementById('val-' + id);
            if (label) {
                label.innerText = parseFloat(slider.value).toFixed(1) + ' dB';
            }
        }

        function toggleMute(id) {
            const btn = document.getElementById('mute-' + id);
            btn.classList.toggle('muted');
        }
    </script>
</body>
</html>
