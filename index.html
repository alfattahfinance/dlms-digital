<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLMS 2In - 4Out Studio Controller</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2d2d2d;
            --silver-card: #c0c0c0;
            --silver-dark: #a0a0a0;
            --silver-light: #e0e0e0;
            --text-dark: #222222;
            --text-light: #ffffff;
            --accent-blue: #007acc;
            --border-color: #777777;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin: 10px 0;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--silver-light);
            text-transform: uppercase;
        }

        .rack-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Desain Bodi/Kartu Utama Silver */
        .silver-panel {
            background: linear-gradient(135deg, var(--silver-light) 0%, var(--silver-card) 50%, var(--silver-dark) 100%);
            color: var(--text-dark);
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.6);
            border: 1px solid var(--border-color);
        }

        .panel-title {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 2px solid var(--text-dark);
            padding-bottom: 4px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.4);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--text-dark);
        }

        .btn-row {
            display: flex;
            gap: 5px;
            margin-top: 4px;
        }

        button {
            flex: 1;
            background-color: var(--text-dark);
            color: var(--text-light);
            border: none;
            padding: 5px;
            font-size: 0.7rem;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }

        button:active {
            background-color: #444;
        }

        .status-bar {
            font-size: 0.7rem;
            text-align: center;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>DLMS 2-In / 4-Out Controller</h2>

    <div class="rack-container">

        <!-- KARTU INPUT SECTION (In A & In B) -->
        <div class="silver-panel">
            <div class="panel-title">
                <span>Input Section (2 CH)</span>
                <span>DSP: Active</span>
            </div>
            <div class="controls-grid">
                <!-- Input A -->
                <div class="control-group">
                    <label>In A Gain: <span id="val-inA">0.0 dB</span></label>
                    <input type="range" id="inA-gain" min="-40" max="12" step="0.5" value="0" oninput="updateVal('inA')">
                    <div class="btn-row">
                        <button onclick="toggleMute('inA')">MUTE</button>
                    </div>
                </div>
                <!-- Input B -->
                <div class="control-group">
                    <label>In B Gain: <span id="val-inB">0.0 dB</span></label>
                    <input type="range" id="inB-gain" min="-40" max="12" step="0.5" value="0" oninput="updateVal('inB')">
                    <div class="btn-row">
                        <button onclick="toggleMute('inB')">MUTE</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- KARTU OUTPUT SECTION (Out 1, 2, 3, 4) -->
        <div class="silver-panel">
            <div class="panel-title">
                <span>Output Section (4 CH Crossover)</span>
            </div>
            <div class="controls-grid">
                <!-- Out 1 -->
                <div class="control-group">
                    <label>Out 1 (Sub): <span id="val-out1">0.0</span></label>
                    <input type="range" id="out1-gain" min="-40" max="6" step="0.5" value="0" oninput="updateVal('out1')">
                    <div class="btn-row">
                        <button onclick="toggleMute('out1')">MUTE</button>
                    </div>
                </div>
                <!-- Out 2 -->
                <div class="control-group">
                    <label>Out 2 (Low): <span id="val-out2">0.0</span></label>
                    <input type="range" id="out2-gain" min="-40" max="6" step="0.5" value="0" oninput="updateVal('out2')">
                    <div class="btn-row">
                        <button onclick="toggleMute('out2')">MUTE</button>
                    </div>
                </div>
                <!-- Out 3 -->
                <div class="control-group">
                    <label>Out 3 (Mid): <span id="val-out3">0.0</span></label>
                    <input type="range" id="out3-gain" min="-40" max="6" step="0.5" value="0" oninput="updateVal('out3')">
                    <div class="btn-row">
                        <button onclick="toggleMute('out3')">MUTE</button>
                    </div>
                </div>
                <!-- Out 4 -->
                <div class="control-group">
                    <label>Out 4 (High): <span id="val-out4">0.0</span></label>
                    <input type="range" id="out4-gain" min="-40" max="6" step="0.5" value="0" oninput="updateVal('out4')">
                    <div class="btn-row">
                        <button onclick="toggleMute('out4')">MUTE</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="status-bar">System Status: Connected (192.168.4.1)</div>

    <script>
        function updateVal(id) {
            const slider = document.getElementById(id + '-gain');
            const label = document.getElementById('val-' + id);
            label.innerText = slider.value + ' dB';
            // Placeholder fungsi AJAX / fetch ke ESP32 nantinya
        }

        function toggleMute(id) {
            // Placeholder fungsi Mute
            console.log('Mute toggled for: ' + id);
        }
    </script>
</body>
</html>
