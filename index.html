<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLMD Digital - Audio Processor 2In/4Out</title>
    <style>
        :root {
            --chassis-silver: linear-gradient(135deg, #e6e6e6 0%, #b3b3b3 50%, #8c8c8c 100%);
            --chassis-border: #595959;
            --panel-black: #121212;
            --text-dark: #111;
            --text-light: #f1f1f1;
            --accent-orange: #ff9900;
        }

        /* Fullscreen Reset */
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Chassis Fullscreen */
        .chassis-rack {
            width: 100vw;
            height: 100vh;
            background: var(--chassis-silver);
            border: 4px solid var(--chassis-border);
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        /* Ornamen Sekrup Sudut */
        .screw {
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #ffffff 20%, #7d7d7d 70%, #333333 100%);
            border-radius: 50%;
            position: absolute;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .screw-tl { top: 10px; left: 10px; }
        .screw-tr { top: 10px; right: 10px; }
        .screw-bl { bottom: 10px; left: 10px; }
        .screw-br { bottom: 10px; right: 10px; }

        /* Header Chassis */
        .chassis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 20px;
            color: var(--text-dark);
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            border-bottom: 2px solid rgba(0,0,0,0.2);
        }

        /* Area Kerja Utama */
        .main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 10px 20px;
            overflow-y: auto;
            justify-content: center;
        }

        /* Panel Hitam di Tengah (Sebagai Layar / Rack Display Utama) */
        .inner-faceplate {
            background-color: var(--panel-black);
            border: 2px solid #2a2a2a;
            border-radius: 6px;
            padding: 15px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.9);
            text-align: center;
            color: #777;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Area Kontrol Fader di Luar Panel (Menyatu di Bodi Silver) */
        .fader-section-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-label-silver {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        @media (min-width: 768px) {
            .grid-layout-out {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        .grid-layout-out {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        /* Kartu Kontrol Fader (Nuansa Silver) */
        .fader-card {
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .fader-header {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #222;
            cursor: pointer;
        }

        .btn-row {
            display: flex;
            gap: 5px;
        }

        button {
            flex: 1;
            background-color: #222;
            color: #fff;
            border: none;
            padding: 5px;
            font-size: 0.7rem;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }

        button.active {
            background-color: #b51a1a;
        }

        /* Footer Chassis */
        .chassis-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 20px;
            color: var(--text-dark);
            font-size: 0.75rem;
            font-weight: bold;
            border-top: 2px solid rgba(0,0,0,0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #008822;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 5px #00cc44;
        }
    </style>
</head>
<body>

    <div class="chassis-rack">
        <!-- Sekrup Sudut -->
        <div class="screw screw-tl"></div>
        <div class="screw screw-tr"></div>
        <div class="screw screw-bl"></div>
        <div class="screw screw-br"></div>

        <!-- Header Chassis -->
        <div class="chassis-header">
            <span>DLMD DIGITAL</span>
            <span>AUDIO PROCESSOR 2IN / 4OUT</span>
        </div>

        <!-- Workspace Utama -->
        <div class="main-workspace">
            
            <!-- Panel Hitam di Tengah -->
            <div class="inner-faceplate">
                DSP Core Engine Active &bull; Routing Matrix Ready
            </div>

            <!-- FADER INPUT (Di Luar Panel / Di Bawah Bodi Silver) -->
            <div class="fader-section-container">
                <span class="section-label-silver">Input Section (2 Channel)</span>
                <div class="grid-layout">
                    <!-- In A -->
                    <div class="fader-card">
                        <div class="fader-header"><span>IN A (MAIN)</span><span id="val-ina">0.0 dB</span></div>
                        <input type="range" id="gain-ina" min="-40" max="12" step="0.5" value="0" oninput="updateGain('ina')">
                        <div class="btn-row">
                            <button id="mute-ina" onclick="toggleMute('ina')">MUTE</button>
                        </div>
                    </div>
                    <!-- In B -->
                    <div class="fader-card">
                        <div class="fader-header"><span>IN B (AUX)</span><span id="val-inb">0.0 dB</span></div>
                        <input type="range" id="gain-inb" min="-40" max="12" step="0.5" value="0" oninput="updateGain('inb')">
                        <div class="btn-row">
                            <button id="mute-inb" onclick="toggleMute('inb')">MUTE</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FADER OUTPUT (Di Luar Panel / Di Bawah Bodi Silver) -->
            <div class="fader-section-container">
                <span class="section-label-silver">Output Section - Crossover (4 Channel)</span>
                <div class="grid-layout-out">
                    <!-- Out 1 -->
                    <div class="fader-card">
                        <div class="fader-header"><span>OUT 1 (SUB)</span><span id="val-out1">0.0</span></div>
                        <input type="range" id="gain-out1" min="-40" max="6" step="0.5" value="0" oninput="updateGain('out1')">
                        <div class="btn-row">
                            <button id="mute-out1" onclick="toggleMute('out1')">MUTE</button>
                        </div>
                    </div>
                    <!-- Out 2 -->
                    <div class="fader-card">
                        <div class="fader-header"><span>OUT 2 (LOW)</span><span id="val-out2">0.0</span></div>
                        <input type="range" id="gain-out2" min="-40" max="6" step="0.5" value="0" oninput="updateGain('out2')">
                        <div class="btn-row">
                            <button id="mute-out2" onclick="toggleMute('out2')">MUTE</button>
                        </div>
                    </div>
                    <!-- Out 3 -->
                    <div class="fader-card">
                        <div class="fader-header"><span>OUT 3 (MID)</span><span id="val-out3">0.0</span></div>
                        <input type="range" id="gain-out3" min="-40" max="6" step="0.5" value="0" oninput="updateGain('out3')">
                        <div class="btn-row">
                            <button id="mute-out3" onclick="toggleMute('out3')">MUTE</button>
                        </div>
                    </div>
                    <!-- Out 4 -->
                    <div class="fader-card">
                        <div class="fader-header"><span>OUT 4 (HIGH)</span><span id="val-out4">0.0</span></div>
                        <input type="range" id="gain-out4" min="-40" max="6" step="0.5" value="0" oninput="updateGain('out4')">
                        <div class="btn-row">
                            <button id="mute-out4" onclick="toggleMute('out4')">MUTE</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Footer Chassis -->
        <div class="chassis-footer">
            <span><span class="status-dot"></span> SYSTEM: ONLINE (192.168.4.1)</span>
            <span>HARDWARE UI V1.0</span>
        </div>
    </div>

    <script>
        function updateGain(id) {
            const slider = document.getElementById('gain-' + id);
            const label = document.getElementById('val-' + id);
            if (label) {
                label.innerText = slider.value + ' dB';
            }
        }

        function toggleMute(id) {
            const btn = document.getElementById('mute-' + id);
            btn.classList.toggle('active');
        }
    </script>
</body>
</html>
