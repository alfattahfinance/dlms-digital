function initAudioPlayer() {
  const fileInput = document.getElementById("audio-file-input");
  const audioElement = document.getElementById("audio-player");
  const nowPlaying = document.getElementById("now-playing");

  fileInput.addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    nowPlaying.textContent = file.name;
    const fileURL = URL.createObjectURL(file);
    audioElement.src = fileURL;
    audioElement.play();

    if (!isAudioInitialized) {
      setupAudioDSPNodes(audioElement);
      isAudioInitialized = true;
    } else if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  });

  requestAnimationFrame(renderRealtimeMeters);
}

function setupAudioDSPNodes(audioElement) {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContextClass();
  audioSourceNode = audioCtx.createMediaElementSource(audioElement);

  // Analyze the source before processing, but route audible audio through the
  // per-input 31-band GEQ chains instead of connecting the source directly.
  rtaAnalyser = audioCtx.createAnalyser();
  rtaAnalyser.fftSize = 4096;
  rtaAnalyser.smoothingTimeConstant = 0.72;
  rtaAnalyser.minDecibels = -90;
  rtaAnalyser.maxDecibels = -20;
  rtaFrequencyData = new Uint8Array(rtaAnalyser.frequencyBinCount);
  audioSourceNode.connect(rtaAnalyser);

  channelIds.forEach(id => {
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.84;
    analysers[id] = analyser;
  });

  const splitter = audioCtx.createChannelSplitter(2);
  const merger = audioCtx.createChannelMerger(2);
  audioSourceNode.connect(splitter);

  ["ina", "inb"].forEach((id, channelIndex) => {
    let previousNode = audioCtx.createGain();
    previousNode.gain.value = 1;
    splitter.connect(previousNode, channelIndex);
    const inputAnalyser = analysers[id];
    previousNode.connect(inputAnalyser);

    const geqNodes = geqFrequencies.map((label, index) => {
      const band = audioCtx.createBiquadFilter();
      band.type = "peaking";
      band.frequency.value = geqFrequencyHz(label);
      band.Q.value = 4.318;
      band.gain.value = channelGeqValues[id][index] || 0;
      previousNode.connect(band);
      previousNode = band;
      return band;
    });
    previousNode.connect(merger, 0, channelIndex);
    filters[id + "_geq"] = geqNodes;
  });
  merger.connect(audioCtx.destination);

  const makeOutputMeterPath = (id, type, frequency, q = 1) => {
    const filter = audioCtx.createBiquadFilter();
    filter.type = type;
    filter.frequency.value = frequency;
    filter.Q.value = q;

    const gain = audioCtx.createGain();
    gain.gain.value = 1;

    audioSourceNode.connect(filter);
    filter.connect(gain);
    gain.connect(analysers[id]);

    filters[id] = filter;
    outputMeterGains[id] = gain;
  };

  outputMeterGains = {};
  makeOutputMeterPath("out1", "lowpass", 130);
  makeOutputMeterPath("out2", "bandpass", 350, 0.8);
  makeOutputMeterPath("out3", "bandpass", 1800, 0.8);
  makeOutputMeterPath("out4", "highpass", 3500);
}

const meterSamples = {};
const meterDbState = Object.fromEntries(channelIds.map(id => [id, -60]));

function getMeterDb(analyser, channelId) {
  if (!analyser) return -60;
  let samples = meterSamples[channelId];
  if (!samples || samples.length !== analyser.fftSize) {
    samples = new Uint8Array(analyser.fftSize);
    meterSamples[channelId] = samples;
  }
  analyser.getByteTimeDomainData(samples);
  let sumSquares = 0;
  for (let i = 0; i < samples.length; i++) {
    const amplitude = (samples[i] - 128) / 128;
    sumSquares += amplitude * amplitude;
  }
  const rms = Math.sqrt(sumSquares / samples.length);
  if (!Number.isFinite(rms) || rms <= 0.000001) return -60;
  return Math.max(-60, Math.min(0, 20 * Math.log10(rms)));
}

function updateVUMeter(id, analyser, active) {
  const meterEl = document.getElementById("meter-" + id);
  if (!meterEl) return;
  const targetDb = active ? getMeterDb(analyser, id) : -60;
  const previousDb = Number.isFinite(meterDbState[id]) ? meterDbState[id] : -60;
  const smoothing = targetDb > previousDb ? 0.62 : 0.24;
  const db = previousDb + (targetDb - previousDb) * smoothing;
  meterDbState[id] = db;
  const clampedDb = Math.max(-60, Math.min(0, db));
  const percent = ((clampedDb + 60) / 60) * 100;
  meterEl.style.height = percent.toFixed(1) + "%";
  meterEl.classList.toggle("meter-green", clampedDb < -9);
  meterEl.classList.toggle("meter-yellow", clampedDb >= -9 && clampedDb < 0);
  meterEl.classList.toggle("meter-red", clampedDb >= -0.5);
}

function initRTACanvases() {
  const targets = [
    { key: "hpf", id: "hpf-graph-box", color: "rgba(0, 220, 255, 0.25)" },
    { key: "peq", id: "peq-graph-box", color: "rgba(255, 0, 150, 0.25)" },
    { key: "geq", id: "geq-container-box", color: "rgba(0, 255, 200, 0.25)" }
  ];
  targets.forEach(target => {
    const host = document.getElementById(target.id);
    if (!host) return;
    let canvas = host.querySelector("canvas.rta-canvas");
    if (!canvas) {
      canvas = document.createElement("canvas");
      canvas.className = "rta-canvas";
      canvas.setAttribute("aria-hidden", "true");
      host.insertBefore(canvas, host.firstChild);
    }
    rtaCanvases[target.key] = { canvas, color: target.color, host };
    resizeRTACanvas(rtaCanvases[target.key]);
  });
}

function resizeRTACanvas(item) {
  if (!item || !item.canvas || !item.host) return null;
  const canvas = item.canvas;
  const rect = item.host.getBoundingClientRect();
  const cssWidth = Math.max(1, rect.width);
  const cssHeight = Math.max(1, rect.height);
  const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  const pixelWidth = Math.max(1, Math.round(cssWidth * dpr));
  const pixelHeight = Math.max(1, Math.round(cssHeight * dpr));

  if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
  if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
  canvas.style.width = "100%";
  canvas.style.height = "100%";

  const ctx = canvas.getContext("2d");
  if (ctx) {
    ctx.resetTransform();
    ctx.setTransform(pixelWidth / GRAPH_COORD_WIDTH, 0, 0, pixelHeight / GRAPH_COORD_HEIGHT, 0, 0);
    ctx.beginPath();
  }
  item.cssWidth = cssWidth;
  item.cssHeight = cssHeight;
  item.dpr = dpr;
  return { width: GRAPH_COORD_WIDTH, height: GRAPH_COORD_HEIGHT, cssWidth, cssHeight, dpr };
}

function drawRTAGlowWave() {
  const audioElement = document.getElementById("audio-player");
  const playable = !!audioCtx && audioCtx.state === "running" && !!audioElement &&
    !audioElement.paused && !audioElement.ended && !!rtaAnalyser && !!rtaFrequencyData;
  if (playable) rtaAnalyser.getByteFrequencyData(rtaFrequencyData);

  const rtaColorByPage = {
    peq: "rgba(255, 0, 150, 0.2)",
    hpf: "rgba(0, 220, 255, 0.2)",
    geq: "rgba(0, 255, 120, 0.2)"
  };

  Object.entries(rtaCanvases).forEach(([key, item]) => {
    if (!["peq", "hpf", "geq"].includes(currentProcessorTab)) {
      const blockedCtx = item?.canvas?.getContext("2d");
      if (blockedCtx && item.canvas) {
        blockedCtx.clearRect(0, 0, item.canvas.width, item.canvas.height);
        blockedCtx.beginPath();
      }
      if (item?.canvas) item.canvas.style.visibility = "hidden";
      return;
    }
    if (item?.canvas) item.canvas.style.visibility = "visible";
    const size = resizeRTACanvas(item);
    const canvas = item.canvas;
    const ctx = canvas.getContext("2d");
    if (!ctx || !size) return;
    const w = size.width;
    const h = size.height;
    ctx.clearRect(0, 0, w, h);
    ctx.globalAlpha = 1.0;
    ctx.globalCompositeOperation = "source-over";
    ctx.shadowBlur = 0;
    ctx.shadowColor = "transparent";
    if (!Object.prototype.hasOwnProperty.call(rtaColorByPage, key) ||
        !playable || w <= 1 || h <= 1) return;

    const baseScale = Math.max(0.35, Math.min(1.25, w / 600, h / 350));
    const sampleRate = audioCtx.sampleRate;
    const binHz = sampleRate / rtaAnalyser.fftSize;
    const minHz = 20;
    const maxHz = Math.max(minHz, Math.min(20000, sampleRate / 2));
    // Batasi RTA ke area plot di dalam bingkai, bukan ke seluruh kartu.
    // HPF memakai SVG 600x350; PEQ memakai viewBox 330x215.
    const plotBounds = key === "hpf"
      // Samakan proporsi area RTA HPF dengan bingkai plot PEQ setelah skala SVG.
      ? { left: (30 / 330) * w, right: (300 / 330) * w, top: (10 / 215) * h, bottom: (190 / 215) * h }
      : key === "peq"
        ? { left: (30 / 330) * w, right: (300 / 330) * w, top: (10 / 215) * h, bottom: (190 / 215) * h }
        : { left: Math.min(12, w * 0.04), right: w - Math.min(12, w * 0.04), top: Math.min(8, h * 0.04), bottom: h - Math.min(8, h * 0.04) };
    const plotLeft = plotBounds.left;
    const plotRight = plotBounds.right;
    const plotTop = plotBounds.top;
    const plotBottom = plotBounds.bottom;
    const plotWidth = Math.max(1, plotRight - plotLeft);
    const plotHeight = Math.max(1, plotBottom - plotTop);
    const points = [];
    const count = Math.max(48, Math.min(160, Math.round(w / (5 * baseScale))));

    for (let i = 0; i < count; i++) {
      const t = i / (count - 1);
      const hz = minHz * Math.pow(maxHz / minHz, t);
      const bin = Math.max(0, Math.min(rtaFrequencyData.length - 1, Math.round(hz / binHz)));
      // Tingkatkan keterbacaan spektrum pada audio pelan tanpa mengubah sinyal audio.
      const rawMagnitude = rtaFrequencyData[bin] / 255;
      const magnitude = Math.pow(rawMagnitude, 0.72);
      points.push({
        x: plotLeft + plotWidth * t,
        y: plotBottom - magnitude * plotHeight
      });
    }

    const color = rtaColorByPage[key];
    ctx.save();
    // Clip seluruh glow/gelombang agar tidak melewati bingkai plot.
    ctx.beginPath();
    ctx.rect(plotLeft, plotTop, plotWidth, plotHeight);
    ctx.clip();
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length - 1; i++) {
      const midX = (points[i].x + points[i + 1].x) / 2;
      const midY = (points[i].y + points[i + 1].y) / 2;
      ctx.quadraticCurveTo(points[i].x, points[i].y, midX, midY);
    }
    const last = points[points.length - 1];
    ctx.lineTo(last.x, last.y);
    ctx.lineTo(plotRight, plotBottom);
    ctx.lineTo(plotLeft, plotBottom);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length - 1; i++) {
      const midX = (points[i].x + points[i + 1].x) / 2;
      const midY = (points[i].y + points[i + 1].y) / 2;
      ctx.quadraticCurveTo(points[i].x, points[i].y, midX, midY);
    }
    ctx.lineTo(last.x, last.y);
    ctx.strokeStyle = color;
    ctx.shadowBlur = 8 * baseScale;
    ctx.shadowColor = color;
    ctx.lineWidth = 3.5 * baseScale;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.restore();
  });
}

function renderRealtimeMeters() {
  requestAnimationFrame(renderRealtimeMeters);

  const rtaAllowed = ["peq", "hpf", "geq"].includes(currentProcessorTab);
  if (rtaAllowed) {
    drawRTAGlowWave();
  } else {
    Object.values(rtaCanvases).forEach(item => {
      if (!item || !item.canvas) return;
      const ctx = item.canvas.getContext("2d");
      if (ctx) {
        ctx.clearRect(0, 0, item.canvas.width, item.canvas.height);
        ctx.beginPath();
      }
      item.canvas.style.visibility = "hidden";
    });
  }
  if (rtaAllowed) {
    Object.values(rtaCanvases).forEach(item => {
      if (item && item.canvas) item.canvas.style.visibility = "visible";
    });
  }

  const audioElement = document.getElementById("audio-player");
  const playable = !!audioCtx && !!audioElement && !audioElement.paused && !audioElement.ended;

  channelIds.forEach(id => {
    const analyser = analysers[id];
    const outputGain = outputMeterGains && outputMeterGains[id];
    const faderEl = document.getElementById("gain-" + id);
    const faderDb = Number.parseFloat(faderEl?.value ?? "0");

    if (outputGain && Number.isFinite(faderDb)) {
      outputGain.gain.setTargetAtTime(
        (muteStates[id] || onStates[id]) ? 0 : Math.pow(10, faderDb / 20),
        audioCtx.currentTime,
        0.015
      );
    }

    updateVUMeter(id, analyser, playable && !!analyser && !muteStates[id] && !onStates[id]);
  });
}

function initDLMD() {
  const curvePanel = document.getElementById("panel-curves");
  const curveConsole = document.querySelector("#panel-mixer > .touchscreen-console");
  if (curvePanel && curveConsole && curveConsole.parentElement !== curvePanel) {
    curvePanel.appendChild(curveConsole);
  }
  try {
    let savedName = localStorage.getItem("dlmd_name") || "DCX2496-PRO";
    document.getElementById("dlmd-name").value = savedName;
    document.getElementById("ip-display").textContent = savedName;
  } catch (err) {}

  try { initKnobEventListeners(); }
  catch (err) { console.error("Knob event binding failed.", err); }

  buildMixerStrips();
  updateSidebarForChannel(currentFocusedChannel || "ina");
  buildGeqSliders();

  try { initFaderThumbHitTesting(); }
  catch (err) { console.error("Fader interaction setup failed.", err); }

  try {
    initRTACanvases();
    window.addEventListener("resize", () => Object.values(rtaCanvases).forEach(resizeRTACanvas), { passive: true });
    if ("ResizeObserver" in window) {
      const rtaResizeObserver = new ResizeObserver(() => {
        Object.values(rtaCanvases).forEach(resizeRTACanvas);
      });
      Object.values(rtaCanvases).forEach(item => {
        if (item.host) rtaResizeObserver.observe(item.host);
      });
    }
  } catch (err) {
    console.error("RTA/Canvas initialization failed.", err);
  }

  try { initAudioPlayer(); }
  catch (err) { console.error("Audio player initialization failed.", err); }

  channelIds.forEach(id => {
    const fader = document.getElementById("gain-" + id);
    if (fader) {
      dlmsState.channels[id].gain = Number(fader.value);
      updateFaderLabel(id, fader.value);
    }
  });

  try { initializePermanentDSPNodes(); }
  catch (err) { console.error("DSP node initialization failed.", err); }
  try { preventDSPGraphPinchZoom(); }
  catch (err) { console.error("DSP graph zoom guard failed.", err); }
  try { initInteractiveGraphs(); }
  catch (err) { console.error("Interactive graph initialization failed.", err); }
  try { initResponsiveGraphScaling(); }
  catch (err) { console.error("Responsive graph scaling initialization failed.", err); }

  try {
    ["preamp", "hpf", "gate", "peq", "comp"].forEach(page => updateGraphYAxisScale(page));
  } catch (err) {
    console.error("Initial graph axis normalization failed.", err);
  }
  try { enforceDSPNodePolicy("preamp"); }
  catch (err) { console.error("DSP policy initialization failed.", err); }
  try { focusChannel("ina"); }
  catch (err) {
    console.error("Initial channel focus failed.", err);
    updateSidebarForChannel("ina");
  }
  setTimeout(syncFaderDimensions, 50);
}

function syncFaderDimensions() {
  document.querySelectorAll('.vertical-fader').forEach(fader => {
    const parentContainer = fader.closest('.vertical-slider-container');
    if (parentContainer) {
      const h = parentContainer.clientHeight;
      if (h > 0) fader.style.width = h + 'px';
    }
  });
}

let faderResizeFrame = 0;
function scheduleResponsiveLayout() {
  if (faderResizeFrame) cancelAnimationFrame(faderResizeFrame);
  faderResizeFrame = requestAnimationFrame(() => {
    faderResizeFrame = 0;
    syncFaderDimensions();
    document.querySelectorAll(".sq-graph-box svg, .eq-curve-box svg").forEach(svg => {
      svg.style.width = "100%";
      svg.style.height = "100%";
    });
  });
}
window.addEventListener("resize", scheduleResponsiveLayout, { passive: true });
window.addEventListener("orientationchange", () => {
  setTimeout(scheduleResponsiveLayout, 80);
}, { passive: true });
if ("ResizeObserver" in window) {
  const responsiveObserver = new ResizeObserver(scheduleResponsiveLayout);
  window.addEventListener("DOMContentLoaded", () => {
    const target = document.querySelector(".app-container");
    if (target) responsiveObserver.observe(target);
  }, { once: true });
}

let activeFaderIndex = null;
let isDraggingFader = false;
let activeFaderPointerId = null;

function initFaderThumbHitTesting() {
  const groups = [
    { selector: '#mixer-bank-container input.vertical-fader', kind: 'mixer' },
    { selector: '#geq-sliders-wrapper input.geq-range', kind: 'geq' }
  ];

  groups.forEach(group => {
    document.querySelectorAll(group.selector).forEach(fader => {
      if (!(fader instanceof HTMLInputElement) || fader.dataset.thumbDragReady === '1') return;
      fader.dataset.thumbDragReady = '1';
      fader.dataset.thumbDragKind = group.kind;

      fader.addEventListener('pointerdown', event => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        const rect = fader.getBoundingClientRect();
        const min = Number(fader.min || 0);
        const max = Number(fader.max || 100);
        const value = Number(fader.value);
        const ratio = max > min ? (value - min) / (max - min) : 0;
        const thumbX = rect.left + rect.width / 2;
        const thumbY = rect.bottom - ratio * rect.height;
        const isGeq = fader.classList.contains('geq-range');
        const hitX = isGeq ? 13 : 19;
        const hitY = isGeq ? 13 : 19;
        const onThumb = Math.abs(event.clientX - thumbX) <= hitX &&
                        Math.abs(event.clientY - thumbY) <= hitY;

        if (!onThumb) {
          isDraggingFader = false;
          activeFaderIndex = null;
          activeFaderPointerId = null;
          event.preventDefault();
          return;
        }

        event.preventDefault();
        isDraggingFader = true;
        activeFaderIndex = fader;
        activeFaderPointerId = event.pointerId;
        try { fader.setPointerCapture(event.pointerId); } catch (err) {}
      }, { passive: false });

      fader.addEventListener('pointermove', event => {
        if (!isDraggingFader || activeFaderIndex !== fader ||
            activeFaderPointerId !== event.pointerId) return;
        event.preventDefault();
        const rect = fader.getBoundingClientRect();
        if (!rect.height) return;
        const min = Number(fader.min || 0);
        const max = Number(fader.max || 100);
        const ratio = Math.max(0, Math.min(1, (rect.bottom - event.clientY) / rect.height));
        const step = Number(fader.step || 1);
        let nextValue = min + ratio * (max - min);
        if (Number.isFinite(step) && step > 0) nextValue = min + Math.round((nextValue - min) / step) * step;
        nextValue = Math.max(min, Math.min(max, nextValue));
        nextValue = Number(nextValue.toFixed(3));
        if (Number(fader.value) === nextValue) return;
        fader.value = String(nextValue);
        if (fader.classList.contains('geq-range')) {
          const match = fader.id.match(/^geq-slider-(\d+)$/);
          if (match) onGeqSliderChange(Number(match[1]), fader.value);
        } else {
          const id = fader.id.replace(/^gain-/, '');
          setChannelGain(id, fader.value);
          updateParam(id, fader.value);
        }
      }, { passive: false });

      const resetDrag = event => {
        if (activeFaderIndex !== fader ||
            (event && activeFaderPointerId !== event.pointerId)) return;
        isDraggingFader = false;
        activeFaderIndex = null;
        activeFaderPointerId = null;
      };
      fader.addEventListener('pointerup', resetDrag);
      fader.addEventListener('pointercancel', resetDrag);
      fader.addEventListener('lostpointercapture', resetDrag);
    });
  });
}

function updateFaderLabel(id, value) {
  const label = document.getElementById("val-" + id);
  if (label) label.textContent = Number(value).toFixed(1) + " dB";
}

function getEsp32BaseUrl() {
  let ip = "192.168.4.1";
  try { ip = (localStorage.getItem("dlmd_esp32_ip") || ip).trim(); } catch (err) {}
  ip = ip.replace(/^https?:\/\//i, "").replace(/\/$/, "");
  return "http://" + ip;
}

function updateParam(id, value) {
  const url = getEsp32BaseUrl() + "/update?ch=" + encodeURIComponent(id) + "&val=" + encodeURIComponent(value);
  clearTimeout(sendTimers[id]);
  sendTimers[id] = setTimeout(() => { sendDeviceCommand(url); }, 20);
}

function sendDeviceCommand(pathOrUrl) {
  const url = /^https?:\/\//i.test(pathOrUrl) ? pathOrUrl : getEsp32BaseUrl() + pathOrUrl;
  fetch(url, { method: "GET", mode: "no-cors", cache: "no-store" }).catch(() => {});
}

function toggleMute(id, evt) {
  if (evt) evt.stopPropagation();
  muteStates[id] = !muteStates[id];
  const muted = muteStates[id];
  document.getElementById("mute-" + id)?.classList.toggle("muted", muted);
  sendDeviceCommand("/mute?ch=" + encodeURIComponent(id) + "&state=" + (muted ? "1" : "0"));
}

function toggleOn(id, evt) {
  if (evt) evt.stopPropagation();
  onStates[id] = !onStates[id];
  const isOff = onStates[id];
  document.getElementById("on-" + id)?.classList.toggle("off", isOff);
  sendDeviceCommand("/power?ch=" + encodeURIComponent(id) + "&state=" + (isOff ? "0" : "1"));
}

function toggleMusicPage(show) {
  const page = document.getElementById("music-page-overlay");
  if (!page) return;
  page.style.display = show ? "flex" : "none";
}

function switchTab(tabName, clickedButton) {
  ["mixer", "curves", "settings"].forEach(name => {
    const panel = document.getElementById("panel-" + name);
    if (panel) {
      panel.classList.toggle("active-panel", name === tabName);
      panel.style.display = (name === tabName) ? "flex" : "none";
    }
  });
  document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
  if (clickedButton) clickedButton.classList.add("active");
  if (tabName === 'mixer') setTimeout(syncFaderDimensions, 20);
  if (tabName === 'curves') {
    requestAnimationFrame(() => {
      Object.values(rtaCanvases).forEach(resizeRTACanvas);
      scheduleResponsiveLayout();
      updateActiveProcessorUI();
    });
  }
}

function saveConnectionSettings() {
  const deviceName = document.getElementById("dlmd-name")?.value.trim() || "DCX2496-PRO";
  localStorage.setItem("dlmd_name", deviceName);
  document.getElementById("ip-display").textContent = deviceName;
  alert("Pengaturan Berhasil Disimpan!\nNama Perangkat/SSID Baru: " + deviceName);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initDLMD);
} else {
  initDLMD();
}
