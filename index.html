
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DLMD Digital - Chassis</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --silver-light: #e2e4e6;
      --silver-mid: #aeb3b8;
      --silver-dark: #737980;
      --panel: #171a1d;
      --panel-edge: #080a0c;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #24272a;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    .workspace {
      width: 100%;
      max-width: 1100px;
    }

    .device {
      width: 100%;
      position: relative;
      padding: 16px;
      border: 1px solid #f1f2f3;
      border-radius: 9px;
      background: linear-gradient(
        180deg,
        #e5e7e9 0%,
        #c6cacf 16%,
        #969ca2 50%,
        #c9cdd1 84%,
        #858b91 100%
      );
      box-shadow:
        0 3px 0 #656a70,
        0 12px 25px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
    }

    .top-edge {
      height: 8px;
      margin: -6px 14px 10px;
      border-radius: 3px;
      background: linear-gradient(
        180deg,
        #777d83,
        #c5c9cd,
        #8d9399
      );
    }

    .front-panel {
      position: relative;
      min-height: 330px;
      padding: 20px;
      overflow: hidden;
      border: 2px solid #565b60;
      border-radius: 4px;
      background: linear-gradient(
        180deg,
        #202428,
        #111416 55%,
        #1b1e21
      );
      box-shadow:
        inset 0 2px 5px rgba(0, 0, 0, 0.9),
        0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .brand {
      position: absolute;
      top: 18px;
      left: 28px;
      color: #e1e3e5;
      font-size: clamp(14px, 2vw, 21px);
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .model {
      position: absolute;
      top: 22px;
      right: 28px;
      color: #92989e;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .empty-panel {
      position: absolute;
      top: 58px;
      right: 18px;
      bottom: 18px;
      left: 18px;
      border: 1px solid rgba(180, 186, 192, 0.09);
      background: rgba(0, 0, 0, 0.08);
    }

    .screw {
      position: absolute;
      width: 12px;
      height: 12px;
      border: 1px solid #656b71;
      border-radius: 50%;
      background: radial-gradient(
        circle at 35% 30%,
        #f0f1f2,
        #a1a6ab 45%,
        #555b60 80%
      );
      box-shadow: 0 1px 2px #000;
      z-index: 2;
    }

    .screw::after {
      content: "";
      position: absolute;
      top: 5px;
      left: 2px;
      width: 6px;
      height: 1px;
      background: #44494e;
      transform: rotate(-35deg);
    }

    .screw.tl { top: 8px; left: 8px; }
    .screw.tr { top: 8px; right: 8px; }
    .screw.bl { bottom: 8px; left: 8px; }
    .screw.br { bottom: 8px; right: 8px; }

    .bottom-edge {
      height: 7px;
      margin: 10px 22px 0;
      border-radius: 0 0 3px 3px;
      background: linear-gradient(
        180deg,
        #747a80,
        #b9bec3,
        #858b91
      );
    }

    .feet {
      display: flex;
      justify-content: space-between;
      padding: 0 38px;
    }

    .foot {
      width: 70px;
      height: 13px;
      border-radius: 0 0 5px 5px;
      background: linear-gradient(
        180deg,
        #34383c,
        #111315
      );
      box-shadow: 0 3px 5px rgba(0, 0, 0, 0.4);
    }

    .caption {
      margin-top: 28px;
      color: #aeb3b8;
      text-align: center;
      font-size: 12px;
      letter-spacing: 1.5px;
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .device {
        padding: 10px;
      }

      .front-panel {
        min-height: 250px;
        padding: 12px;
      }

      .brand {
        top: 15px;
        left: 18px;
        letter-spacing: 1.5px;
      }

      .model {
        top: 19px;
        right: 17px;
        font-size: 8px;
      }

      .empty-panel {
        top: 48px;
        right: 12px;
        bottom: 12px;
        left: 12px;
      }

      .feet {
        padding: 0 20px;
      }

      .foot {
        width: 48px;
      }
    }
  </style>
</head>

<body>
  <main class="workspace">
    <section class="device" aria-label="Rangka DLMD Digital warna silver">
      <div class="top-edge"></div>

      <div class="front-panel">
        <span class="screw tl"></span>
        <span class="screw tr"></span>
        <span class="screw bl"></span>
        <span class="screw br"></span>

        <div class="brand">DLMD DIGITAL</div>
        <div class="model">AUDIO PROCESSOR</div>

        <!-- Panel ini sengaja dikosongkan untuk tahap berikutnya -->
        <div class="empty-panel"></div>
      </div>

      <div class="bottom-edge"></div>

      <div class="feet">
        <div class="foot"></div>
        <div class="foot"></div>
      </div>
    </section>

    <p class="caption">
      DLMD DIGITAL &nbsp; / &nbsp; CHASSIS DESIGN
    </p>
  </main>
</body>
</html>
