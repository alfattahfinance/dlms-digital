<html lang="id">

    <title>DLMD Digital - Audio Processor 2In/4Out</title>
    <style>
        :root {
            --chassis-silver: linear-gradient(135deg, #e6e6e6 0%, #b3b3b3 50%, #8c8c8c 100%);
            --chassis-border: #595959;
            --text-dark: #111;
            --text-light: #f1f1f1;
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: #141414;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-light);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .app-container {
            width: 100vw; height: 100vh; background-color: #1a1a1a;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px; position: relative;
        }
        .chassis-rack {
            width: 100%; background: var(--chassis-silver);
            border: 3px solid var(--chassis-border);
            padding: 8px 15px; display: flex; justify-content: space-between;
            align-items: center; position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-radius: 4px;
        }
        .screw {
            width: 10px; height: 10px;
            background: radial-gradient(circle, #ffffff 20%, #7d7d7d 70%, #333333 100%);
            border-radius: 50%; position: absolute;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }
        .screw-tl { top: 6px; left: 6px; }
        .screw-tr { top: 6px; right: 6px; }
        .screw-bl { bottom: 6px; left: 6px; }
        .screw-br { bottom: 6px; right: 6px; }

        .chassis-status { color: var(--text-dark); font-size: 0.65rem; font-weight: bold; margin-right: 12px; display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 6px; height: 6px; background-color: #008822; border-radius: 50%; box-shadow: 0 0 4px #00cc44; }

        .fader-workspace {
            flex: 1; display: flex; flex-direction: column;
            justify-content: flex-start; align-items: center;
            padding-top: 20px; gap: 12px;
            overflow-y: auto !important; -webkit-overflow-scrolling: touch; width: 100%;
        }
        .section-group-title {
            font-size: 0.65rem; font-weight: bold; color: #888;
            text-transform: uppercase; letter-spacing: 1.5px;
            align-self: flex-start; margin-left: 10px;
        }
