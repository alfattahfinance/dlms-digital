<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a1a">
  <title>DLMD Professional DLMS - DSP Processor Console</title>

  <style>
    :root {
      --dark-chassis: linear-gradient(145deg, #2b2b2b, #191919);
      --strip-bg: linear-gradient(135deg, #222222, #161616);
      --screen-bg: #0b0f17;
      --text-light: #e2e8f0;
      --amber: #ffbb00;
      --amber-glow: 0 0 14px rgba(255, 187, 0, 0.8), 0 0 25px rgba(255, 187, 0, 0.3);
      --sq-green: #00ff55;
      --neon-blue: #00e5ff;
      --neon-rose: #ff2a6d;
      --neon-emerald: #00ffaa;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #2b2b2b;
      color: var(--text-light);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 4px;
      gap: 3px;
      background: #1a1a1a;
      border: 2px solid #333;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 8px 20px rgba(0,0,0,0.7);
    }

    .chassis-rack {
      min-height: 26px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 12px;
      background: var(--dark-chassis);
      border: 1px solid #444;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.1), 0 4px 6px rgba(0,0,0,0.6);
      position: relative;
    }

    .screw {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: radial-gradient(circle,#888 20%,#444 70%,#111);
      box-shadow: inset 0 1px 2px #000;
    }

    .screw-tl { top: 2px; left: 5px; }
    .screw-tr { top: 2px; right: 5px; }
    .screw-bl { bottom: 2px; left: 5px; }
    .screw-br { bottom: 2px; right: 5px; }

    .chassis-title {
      color: #fff;
      font-weight: 800;
      font-size: .65rem;
      letter-spacing: 1.2px;
      margin-left: 10px;
    }

    .chassis-status {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #aaa;
      font-size: .52rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #00ff55;
      border-radius: 50%;
      box-shadow: 0 0 6px #00ff55;
    }

    .player-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #161a22;
      padding: 2px 8px;
      border-bottom: 1px solid #333;
      font-size: .55rem;
      flex-shrink: 0;
    }

    .player-bar label {
      background: var(--neon-blue);
      color: #000;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
    }

    .player-bar input[type="file"] {
      display: none;
    }

    .player-bar audio {
      flex: 1;
      height: 22px;
      outline: none;
      filter: invert(90%) hue-rotate(180deg);
    }

    .nav-tabs {
      display: flex;
      flex-shrink: 0;
      gap: 3px;
      padding: 2px 5px;
      background: #111;
      border-bottom: 1px solid #333;
      overflow-x: auto;
    }

    .tab-btn {
      flex-shrink: 0;
      padding: 3px 8px;
      color: #ccc;
      background: #222;
      border: 1px solid #444;
      border-radius: 3px;
      font-size: .55rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: #111;
      background: var(--amber);
      border-color: #cca600;
      box-shadow: var(--amber-glow);
    }

    .fader-workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
      width: 100%;
      padding: 2px;
      overflow: hidden;
    }

    .touchscreen-console, .mixer-bank {
      width: 100%;
    }

    .touchscreen-console {
      flex: 0 0 auto;
      height: 195px;
      max-height: 48vh;
      background: radial-gradient(circle at center, #111a26 0%, #05080e 100%);
      border: 1px solid #2563eb;
      border-radius: 4px;
      display: flex;
      padding: 4px;
      gap: 6px;
      box-shadow: inset 0 0 20px rgba(0,149,255,0.15), 0 0 12px rgba(0,0,0,0.8);
      margin-bottom: 2px;
    }

    .tc-sidebar {
      width: 95px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: #090d16;
      border: 1px solid #1e293b;
      padding: 2px;
      border-radius: 3px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .tc-side-btn {
      background: #131d31;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 4px;
      font-size: .52rem;
      font-weight: bold;
      text-align: center;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .tc-side-btn:hover {
      border-color: var(--neon-blue);
      color: #fff;
    }

    .tc-side-btn.active {
      background: linear-gradient(135deg, #c2410c, #ea580c);
      color: #fff;
      border-color: #fb923c;
      box-shadow: 0 0 10px rgba(234, 88, 12, 0.5);
    }

    .tc-center-graph {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--screen-bg);
      border: 1px solid #1e293b;
      border-radius: 3px;
      padding: 4px;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
      overflow: hidden;
    }

    .sq-graph-box {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      flex: 0 0 auto;
      max-height: 100%;
      position: relative;
      touch-action: none;
      cursor: crosshair;
      box-sizing: border-box;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(71, 85, 105, .55);
      border-radius: 4px;
      background: transparent;
    }

    .sq-graph-box svg {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: block;
      overflow: hidden;
    }

    .rta-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      opacity: 1;
    }

    .sq-graph-box > svg {
      position: relative;
      z-index: 2;
      background: transparent;
      pointer-events: auto;
      touch-action: none;
    }

    .sq-graph-box,
    .sq-graph-box > svg,
    #gate-graph-box,
    #comp-graph-box {
      pointer-events: auto;
    }

    .tc-right-knobs-panel {
      touch-action: none !important;
      position: relative;
      z-index: 5;
      pointer-events: auto;
    }

    .tc-right-knobs-panel .physical-knob-container,
    .tc-right-knobs-panel .physical-knob,
    .tc-master-strip[data-knob-param] {
      position: relative;
      z-index: 6;
      pointer-events: auto;
      touch-action: none !important;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .sq-curve-fill {
      opacity: .28;
    }

    /* RTA berada di atas latar grafik agar terlihat, tetapi tidak menghalangi sentuhan. */
    #hpf-graph-box, #peq-graph-box, #geq-container-box {
      position: relative;
      isolation: isolate;
    }
    #hpf-graph-box > .rta-canvas,
    #peq-graph-box > .rta-canvas,
    #geq-container-box > .rta-canvas {
      position: absolute !important;
      inset: 0 !important;
      display: block !important;
      z-index: 2 !important;
      width: 100% !important;
      height: 100% !important;
      opacity: 1 !important;
      visibility: visible;
      pointer-events: none !important;
      mix-blend-mode: screen;
    }
    #hpf-graph-box > svg,
    #peq-graph-box > svg { position: relative; z-index: 1; }
    #geq-container-box .geq-scale-side,
    #geq-container-box .geq-sliders-wrapper { position: relative; z-index: 3; }

    .processor-subpage {
      box-sizing: border-box;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .sq-grid-line {
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 0.75;
      opacity: 1;
      vector-effect: non-scaling-stroke;
      shape-rendering: geometricPrecision;
    }

    .zero-fixed-line {
      stroke: rgba(255, 255, 255, 0.42);
      stroke-width: 1.25;
      opacity: 1;
      vector-effect: non-scaling-stroke;
      shape-rendering: geometricPrecision;
    }

    .sq-grid-text {
      fill: rgba(255, 255, 255, 0.55);
      font-size: 8px;
      font-weight: 400;
      font-family: Arial, sans-serif;
      dominant-baseline: middle;
      paint-order: stroke;
      stroke: rgba(10, 15, 25, 0.75);
      stroke-width: 0.7px;
      stroke-linejoin: round;
    }

    .sq-curve-fill {
      opacity: 1;
      pointer-events: none;
      stroke: none;
    }

    .sq-curve-line,
    .neon-line-blue,
    .neon-line-emerald,
    .neon-line-peq {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: none !important;
      stroke-dashoffset: 0 !important;
      opacity: 1;
    }

    .sq-curve-line {
      stroke: #ffd15c;
      stroke-width: 2.8;
      filter: none !important;
    }

    .neon-line-blue {
      stroke: #36f4ff;
      stroke-width: 2.8;
      filter: none !important;
    }

    .neon-line-emerald {
      stroke: #3dffd0;
      stroke-width: 2.8;
      filter: none !important;
    }

    .neon-line-peq {
      stroke: #ff4fa3;
      stroke-width: 3;
      filter: drop-shadow(0 0 2px rgba(255,79,163,.95)) drop-shadow(0 0 6px rgba(255,40,145,.72)) !important;
    }
    /* Garis neon bergerak bebas; isian gelombang tetap tertutup sampai garis 0 dB. */
    #peq-curve-path { transition: d 70ms linear; }
    #peq-fill-path {
      opacity: .82;
      transition: none !important;
      stroke: none !important;
      pointer-events: none;
      filter: drop-shadow(0 0 4px rgba(255,55,160,.34));
    }
    /* PEQ: warna band transparan; tanda putih hanya untuk band terpilih. */
    #proc-page-peq .screen-real-knob > circle {
      fill: var(--node-band-fill, rgba(54,244,255,.45)) !important;
      stroke: none !important;
      stroke-width: 0 !important;
      filter: none !important;
    }
    #proc-page-peq .screen-real-knob.is-selected > circle {
      stroke: #ffffff !important;
      stroke-width: 2.2 !important;
      filter: drop-shadow(0 0 2px rgba(255,255,255,.75)) !important;
    }

    .screen-real-knob {
      cursor: grab;
      touch-action: none;
      filter: none !important;
    }

    /* Default titik grafik lain tetap mengikuti gaya yang sudah ada. */
    .screen-real-knob > circle {
      fill: transparent !important;
      stroke-width: 2.2;
      vector-effect: non-scaling-stroke;
    }
    .screen-real-knob.is-selected > circle {
      fill: var(--node-active-fill, rgba(54,244,255,0.14)) !important;
      stroke-width: 2.8;
    }
    /* Khusus PEQ, aturan di atas ditimpa oleh gaya titik band di #proc-page-peq. */

    .sq-graph-box {
      overflow: hidden;
      contain: none;
      isolation: auto;
      transform: none;
      -webkit-transform: none;
      backface-visibility: visible;
      -webkit-backface-visibility: visible;
      background: transparent !important;
      background-color: transparent !important;
      box-shadow: none;
      outline: none;
    }

    #gate-graph-box,
    #comp-graph-box {
      background: transparent !important;
      background-color: transparent !important;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    #gate-graph-box > svg,
    #comp-graph-box > svg {
      background: transparent !important;
      background-color: transparent !important;
      border: 0;
      box-shadow: none;
    }

    .sq-graph-box,
    #gate-graph-box,
    #comp-graph-box {
      box-sizing: border-box;
      position: relative;
      width: 100%;
      height: auto !important;
      aspect-ratio: 3 / 2;
      max-height: min(380px, 100%);
      min-height: 0;
      flex: 0 1 auto;
      align-self: center;
    }

    .sq-graph-box > svg,
    #gate-graph-box > svg,
    #comp-graph-box > svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sq-graph-box svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      clip-path: none;
      background-color: transparent;
      shape-rendering: geometricPrecision;
      transform: none;
      -webkit-transform: none;
      backface-visibility: visible;
      -webkit-backface-visibility: visible;
    }

    .screen-real-knob:hover, .screen-real-knob:active {
      cursor: grabbing;
    }

    @media (hover: none) and (pointer: coarse) {
      .sq-curve-line,
      .neon-line-blue,
      .neon-line-emerald,
      .neon-line-peq,
      .screen-real-knob {
        filter: none !important;
      }
    }

    .geq-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      gap: 2px;
      background: transparent;
      border-radius: 0;
      padding: 3px;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #46515e #101318;
      touch-action: pan-x pan-y;
    }

    .geq-scale-side {
      width: 24px;
      flex-shrink: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 8px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.55);
      font-family: monospace;
      text-align: right;
      padding: 12px 2px 18px 0;
      font-weight: bold;
    }

    .geq-sliders-wrapper {
      position: relative;
      height: 100%;
      flex: 0 0 max(700px, calc(100% - 26px));
      width: max(700px, calc(100% - 26px));
      min-width: 700px;
      min-height: 0;
      overflow: hidden;
      padding: 0;
      --geq-band-width: 22px;
      background-color: transparent;
      background-image: none;
    }

    .geq-slider-col {
      position: absolute;
      top: 0;
      bottom: 0;
      width: var(--geq-band-width);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      max-width: none;
      flex-shrink: 0;
      transform: translateX(-50%);
    }

    .geq-slider-track {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    input[type="range"].geq-range {
      -webkit-appearance: none;
      appearance: none;
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(33vh, 155px);
      height: 32px;
      touch-action: pan-y;
      transform: translate(-50%, -50%) rotate(-90deg);
      background: transparent;
      outline: none;
      cursor: pointer;
    }

    input[type="range"].geq-range::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      background: #1e293b;
      border-radius: 2px;
    }

    input[type="range"].geq-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 16px;
      margin-top: -8px;
      box-sizing: border-box;
      background: linear-gradient(to right, transparent 0%, transparent calc(50% - 0px), #fff calc(50% - 0px), #ffffff calc(50% + 1px), transparent calc(50% + 1px), transparent 100%), rgba(30, 30, 30, 0.9);
      border: 1.2px solid rgba(255, 255, 255, 0.55);
      border-radius: 3px;
      box-shadow: inset 0 1px 2px rgba(255,255,255,.35), 0 2px 4px rgba(0,0,0,.65);
      cursor: grab;
    }

    .geq-val-label {
      font-size: 3.5px;
      color: #34d399;
      font-family: monospace;
      text-align: center;
      white-space: nowrap;
      height: 9px;
      line-height: 9px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .geq-freq-label-wrapper {
      height: 20px;
      width: 100%;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .geq-freq-label {
      font-size: 5px;
      color: rgba(255, 255, 255, 0.35);
      font-family: monospace;
      text-align: center;
      white-space: nowrap;
      transform: rotate(-90deg);
      transform-origin: center center;
      font-weight: 400;
      background: transparent;
      border: 0;
    }

    .tc-right-knobs-panel {
      width: 175px;
      display: flex;
      flex-direction: column;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 3px;
      padding: 4px;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .knobs-grid {
      display: grid;
      grid-template-columns: repeat(1, 2fr);
      gap: 4px;
      overflow-y: auto;
      max-height: 135px;
      padding-right: 2px;
      align-content: start;
    }

 .physical-knob-container {
      background: linear-gradient(to bottom, #424b57, #252c36);
      border: 1px solid #424b58;
      border-radius: 3px;
      padding: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      touch-action: none;
    }

    .physical-knob-container label {
      font-size: .50rem;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 1px;
      font-weight: bold;
    }

    .physical-knob {
      --knob-size: 50px;
      width: var(--knob-size);
      height: var(--knob-size);
      flex: 0 0 var(--knob-size);
      border-radius: 50%;
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #02040a;
      background:
        repeating-conic-gradient(from 0deg, #141922 0deg 4deg, #fff 3deg 4deg, #141922 5deg 9deg),
        #202733;
      box-shadow: 0 2px 2px #02040a, inset 0 0px 0px rgba(255,255,255,.32);
    }

    .physical-knob::before {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      z-index: -1;
      background: radial-gradient(circle at 32% 24%, #707985 0%, #424b58 18%, #242b35 48%, #10151d 78%, #05080d 100%);
      border: 1px solid #87909c;
    }

    .knob-indicator {
      position: absolute;
      top: 4px;
      left: 50%;
      width: 2.5px;
      height: 9px;
      background: linear-gradient(to right, #d8dde4 0%, #ffffff 48%, #fff 100%);
      border: 1px solid #202630;
      transform: translateX(-50%);
      transform-origin: 50% 12px;
      border-radius: 2px;
      z-index: 2;
      pointer-events: none;
    }

    .physical-knob-container span {
      font-size: .48rem;
      color: var(--amber);
      font-family: monospace;
      font-weight: bold;
      margin-top: 1px;
    }

    .tc-master-strip {
      display: flexm
      align-items: center;
      justify-content: space-between;
      background: #334155;
      border: 1px solid #334155;
      padding: 4px 4px;
      border-radius: 1px;
      margin-top: 2px;
      cursor: grab;
      touch-action: none;
    }

    .tc-master-strip label {
      font-size: .50rem;
      color: #94a3b8;
      font-weight: bold;
    }

    .tc-master-strip span {
      font-size: .48rem;
      color: var(--sq-green);
      font-family: monospace;
      font-weight: bold;
    }

    .tc-power-btn {
      background: linear-gradient(to bottom, #16a34a, #14532d);
      color: #fff;
      border: 1px solid #4ade80;
      border-radius: 3px;
      font-size: .48rem;
      font-weight: bold;
      padding: 3px 0;
      cursor: pointer;
      width: 100%;
      margin-top: 2px;
      text-align: center;
    }

    .tc-power-btn.off {
      background: linear-gradient(to bottom, #334155, #0f172a);
      color: #64748b;
      border-color: #475569;
    }

    .section-group-title {
      flex-shrink: 0;
      width: 100%;
      margin: 1px 0 2px;
      color: #aaa;
      font-size: .52rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding-left: 2px;
    }

    .mixer-bank {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 4px;
      width: 100%;
      padding: 2px 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .channel-strip {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 3px;
      padding: 4px;
      background: var(--strip-bg);
      border: 1px solid #333;
      border-radius: 4px;
      box-shadow: inset 0 0 8px rgba(255,255,255,0.03), 0 4px 12px rgba(0,0,0,0.6);
      cursor: pointer;
    }

    input[type="range"].vertical-fader {
      -webkit-appearance: none;
      appearance: none;
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(100% - 2px);
      height: 26px;
      transform: translate(-50%, -50%) rotate(-90deg);
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      touch-action: none; 
      z-index: 3;
      margin: 0;
      padding: 0;

    input[type="range"].vertical-fader::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 36px;  
      height: 22px; 
      margin-top: -1px; 
      box-sizing: border-box;
      border: 1.2px solid rgba(255, 255, 255, 0.45);
      border-radius: 3px;
      background: linear-gradient(to right, transparent 0%, transparent calc(50% - 1px), #ffffff calc(50% - 1px), #ffffff calc(50% + 1px), transparent calc(50% + 1px), transparent 100%), rgba(30, 30, 30, 0.65);
